<!doctype html>
<html lang="es" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%277%27 fill=%27%23EC4A17%27/%3E%3Ctext x=%2732%27 y=%2745%27 text-anchor=%27middle%27 font-family=%27Arial Narrow,Arial,sans-serif%27 font-weight=%27900%27 font-size=%2734%27 letter-spacing=%27-2%27 fill=%27%2317140F%27%3ERG%3C/text%3E%3C/svg%3E">
<title>Ricardo Grisales Ramírez</title>
<meta name="description" content="Periodista e investigador. Analizo el lenguaje político: qué promete, qué oculta y a quién deja fuera. Ensayos, críticas e IRA, el Índice de Resonancia Afectiva.">
<meta property="og:title" content="Ricardo Grisales Ramírez">
<meta property="og:description" content="Analizo las palabras. Ensayos, críticas e investigación sobre el lenguaje político.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oranrick.com/">
<meta property="og:image" content="https://oranrick.com/img/rick-full-bw.jpg">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#F3EFE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@500;700;800;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Schibsted+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EFE6;--paper-2:#EAE4D8;--ink:#17140F;--muted:#6A6359;--rule:#CFC6B6;--mark:#EC4A17;--accent:#B83210;--on-mark:#17140F;
  --head:'Sofia Sans Extra Condensed','Arial Narrow',sans-serif;--text:'Literata',Georgia,serif;--mono:'Libre Franklin','Franklin Gothic Medium','Helvetica Neue',Arial,sans-serif;
  --ira-bg:#061716;--ira-line:#173130;--ira-text:#F2F5F2;--ira-dim:#9DB0AE;--ira-gold:#DCB149;--ira-sage:#8DAA7E;
  --ease:cubic-bezier(.2,.75,.15,1);
}
html[data-theme=night]{--paper:#12110E;--paper-2:#1B1915;--ink:#ECE5D7;--muted:#A69D8E;--rule:#38332C;--mark:#FF7547;--accent:#FF7547;--on-mark:#12110E}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
[id]{scroll-margin-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px}
::selection{background:var(--mark);color:var(--on-mark)}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}
.mono{font-family:var(--mono)}

/* ===== cabecera ===== */
.strip{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0 10px;font:500 12px/1 var(--mono);color:var(--muted)}
.strip .mid{text-align:center;font:italic 400 14px/1.2 var(--mono);color:var(--muted)}
.strip button{font:500 12px/1 var(--mono);color:var(--ink);padding:4px 0;position:relative}
.strip button b{font-weight:500;color:var(--accent)}
.masthead{position:relative;text-align:center;padding:6px 0 0}
.rule-thick,.rule-thin{height:0;border:0;margin:0;transform-origin:center}
.rule-thick{border-top:5px solid var(--mark)}
.rule-thin{border-top:1px solid var(--ink)}
.brand{display:block;font:900 clamp(54px,10.6vw,158px)/.82 var(--head);letter-spacing:-.012em;padding:14px 0 10px;white-space:nowrap}
.brand .l{display:inline-block}
.nav{display:flex;justify-content:center;gap:clamp(14px,3vw,40px);padding:11px 0;font:500 15px/1 var(--mono);border-bottom:1px solid var(--rule)}
.nav a{position:relative;padding:3px 0}
.ticker{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--ink);padding:9px 0;overflow:hidden}
.ticker-label{flex:none;font:700 12px/1 var(--mono);color:var(--on-mark);background:var(--mark);padding:6px 9px 5px;text-transform:uppercase;letter-spacing:.07em}
.ticker-track{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker-line{display:inline-flex;align-items:center;white-space:nowrap;font:400 14px/1 var(--mono);color:var(--ink);animation:marquee 90s linear infinite}

.ticker-line b{font-weight:700;color:var(--accent);margin-right:8px;text-transform:uppercase;letter-spacing:.06em;font-size:.82em}

.ticker:hover .ticker-line{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}

/* subrayado a mano */
.ink{position:relative;display:inline;background:linear-gradient(var(--mark),var(--mark)) 0 100%/0 1.5px no-repeat;padding-bottom:3px;transition:background-size .45s var(--ease)}
.ink:hover,a:hover .ink,.ink.on{background-size:100% 1.5px}
.row:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--mark);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.row:hover:after{transform:scaleX(1)}
.row>svg{position:absolute;left:0;bottom:-5px;width:100%;height:9px;overflow:visible;pointer-events:none}
.row>svg path{stroke-width:2}
.nowrap{white-space:nowrap}

/* ===== portada ===== */
.front{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 1px minmax(300px,.92fr);gap:0 32px;padding:34px 0 40px;border-bottom:3px double var(--ink)}
.lead{grid-column:1/3}
.vrule{grid-column:3;background:var(--rule)}
.side{grid-column:4}
.kicker{font:700 12px/1 var(--mono);color:var(--accent);letter-spacing:.07em;text-transform:uppercase}
.headline{font:900 clamp(64px,8.6vw,132px)/.84 var(--head);letter-spacing:-.015em;margin:14px 0 0}
.gl{position:relative;display:inline-block}
.gl-l{position:absolute;left:.02em;right:.02em;bottom:calc(100% + 1px);padding-bottom:7px;color:var(--accent);white-space:nowrap;line-height:1;opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0s);pointer-events:none}
.gl-l i{display:block;font:600 clamp(10px,.9vw,12.5px)/1 var(--mono);letter-spacing:.08em;font-style:normal}
.gl-l:after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;border:1.5px solid var(--mark);border-bottom:0;transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease);transition-delay:calc(var(--d,0s) + .15s)}
.headline.glossed .gl-l{opacity:1;transform:none}.headline.glossed .gl-l:after{transform:none}
.headline{padding-top:.32em}
.swap{position:relative;display:inline-block;vertical-align:bottom;white-space:nowrap;transition:width .5s var(--ease)}
.swap .w{display:inline-block;position:relative;transition:transform .5s var(--ease),opacity .4s var(--ease),color .9s var(--ease)}
.swap .w.nx{position:absolute;left:0;top:0;transform:translateY(.45em);opacity:0;color:var(--mark)}
.swap .w.nx.in{transform:none;opacity:1}
.swap .w.out{transform:translateY(-.4em);opacity:0}
.swap .w:after{content:'';position:absolute;left:-2%;right:-2%;top:54%;height:.075em;border-radius:99px;background:var(--mark);transform:scaleX(0) rotate(-1.2deg);transform-origin:left;transition:transform .32s var(--ease)}
.swap .w.struck:after{transform:scaleX(1) rotate(-1.2deg)}
.swap .w.struck{color:var(--muted)}
.deck{font:italic 400 clamp(19px,1.7vw,23px)/1.42 var(--text);color:var(--muted);max-width:34ch;margin:0 0 22px}
.byline{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:22px}
.photo{width:52px;height:60px;flex:none;background:radial-gradient(circle,var(--ink) 1.1px,transparent 1.4px) 0 0/5px 5px;opacity:.55;display:grid;place-items:end center;font:500 10px/1 var(--mono);color:var(--paper);filter:grayscale(1)}
.byline .who{font:600 15px/1.2 var(--text)}
.byline .what{font:400 12px/1.4 var(--mono);color:var(--muted);margin-top:3px}
.lead-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:30px;align-items:start;margin-top:40px;padding-bottom:22px;margin-bottom:24px;border-bottom:1px solid var(--rule)}
.lead-grid .deck{max-width:none;margin:0;font-size:clamp(20px,1.85vw,25px)}
.col-byline{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--rule);padding-left:22px}
.col-byline .who{font:600 15px/1.25 var(--text)}
.col-byline .what{font:400 12px/1.45 var(--mono);color:var(--muted);margin-top:4px}
.photo.big{width:72px;height:86px;background-size:6px 6px}
.cols{columns:2;column-gap:32px;column-rule:1px solid var(--rule);font:400 17px/1.62 var(--text);hyphens:auto}
.cols p{margin:0 0 12px}
.cols p:first-child:first-letter{initial-letter:3;-webkit-initial-letter:3;font-family:var(--head);font-weight:900;margin-right:8px;color:var(--ink)}
.cols .sign{font-style:italic;margin-top:18px}
.firma-w{display:block;margin-top:6px;color:var(--ink);break-inside:avoid}
.firma-w .firma{display:block;width:min(230px,70%);height:auto;overflow:visible}
.sign.reveal{filter:none;transform:none}
.sign.reveal .firma{clip-path:inset(-10% 100% -10% 0)}
.sign.reveal.in .firma{animation:escribir 1.9s .35s cubic-bezier(.55,.05,.35,1) both}
@keyframes escribir{from{clip-path:inset(-10% 100% -10% 0)}to{clip-path:inset(-10% -2% -10% 0)}}
.foot-l{display:flex;align-items:center;gap:12px}
.foot-firma{color:var(--mark);display:inline-flex}
.foot-firma .firma{height:26px;width:auto}
.firma path{stroke:currentColor;stroke-width:.9;stroke-linejoin:round}
.foot-firma .firma path{stroke-width:2.6}
.cols p a .ink{font-weight:500}
.jump{font:500 12px/1 var(--mono);color:var(--accent);display:inline-block;margin-top:4px}

/* IRA */
.side-label{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:14px}
.side-label h2{font:800 30px/1 var(--head);margin:0;letter-spacing:.005em}
.ira{background:var(--ira-bg);color:var(--ira-text);border-radius:6px;padding:20px 20px 16px;font-family:'Schibsted Grotesk',sans-serif;position:relative;overflow:hidden}
.ira-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wordmark{font:900 40px/.8 'Schibsted Grotesk';letter-spacing:-.07em;position:relative}
.wordmark i{position:absolute;left:7px;top:-7px;width:7px;height:7px;border-radius:50%;background:var(--ira-sage);box-shadow:0 0 0 3px #8DAA7E40,0 0 0 7px #8DAA7E18;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 #8DAA7E80,0 0 0 0 #8DAA7E40}100%{box-shadow:0 0 0 7px #8DAA7E00,0 0 0 14px #8DAA7E00}}
.ira-sub{font:500 12px/1.35 'Schibsted Grotesk';color:var(--ira-dim);text-align:right;max-width:15ch}
.ira-q{font:700 24px/1.05 'Schibsted Grotesk';letter-spacing:-.025em;margin:18px 0 14px}
.ira-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 46px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ira-line)}
.ira-row .n{font:700 15px/1.15 'Schibsted Grotesk'}
.ira-row .c{font:500 11px/1.3 'Schibsted Grotesk';color:var(--ira-dim);margin-top:2px}
.ira-row svg{width:90px;height:26px;overflow:visible}
.ira-row svg path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s var(--ease)}
.ira.on svg path{stroke-dashoffset:0}
.ira-row .s{font:900 22px/1 'Schibsted Grotesk';letter-spacing:-.04em;text-align:right}
.scale{height:3px;margin:12px 0 6px;background:linear-gradient(90deg,#8F1C17,#CB4021,#E59236,#DCB149,#8DAA7E)}
.scale-l{display:flex;justify-content:space-between;font:500 11px 'Schibsted Grotesk';color:var(--ira-dim)}
.ira-note{font:400 12px/1.5 var(--mono);color:var(--muted);margin:12px 0 10px}
.ira .ink{background-image:linear-gradient(var(--ira-gold),var(--ira-gold))}
.ira-go{font:700 14px/1 'Schibsted Grotesk';color:var(--ira-gold);display:inline-block;margin-top:14px}

/* en portada */
.section-bar{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding:26px 0 8px;margin-bottom:22px}
.section-bar h2{font:800 clamp(32px,3.4vw,44px)/1 var(--head);margin:0}
.section-bar>span{font:500 12px/1 var(--mono);color:var(--muted)}
.feature{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:36px;padding-bottom:40px;border-bottom:1px solid var(--rule)}
.feature figure{margin:0}
.feature .frame{overflow:hidden;background:#000}
.feature img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.feature a:hover img{transform:scale(1.03)}
figcaption{font:400 12px/1.5 var(--mono);color:var(--muted);margin-top:8px}
.feature h3{font:900 clamp(46px,5vw,76px)/.86 var(--head);margin:12px 0 16px;letter-spacing:-.01em}
.feature p{font:400 18px/1.6 var(--text);margin:0 0 14px}
.feature .deck{margin-bottom:16px}

/* hemeroteca */
.archive{padding-bottom:36px}
.row{display:grid;grid-template-columns:54px 170px minmax(0,1fr) 130px;gap:18px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--rule);position:relative}
.row .num{font:500 13px/1 var(--mono);color:var(--muted)}
.row .typ{font:500 12px/1 var(--mono);color:var(--accent)}
.row .t{font:500 clamp(22px,2.3vw,32px)/1.12 var(--text);letter-spacing:-.01em}
.row .pg{font:500 12px/1 var(--mono);color:var(--muted);text-align:right}
.peek{position:fixed;left:0;top:0;width:230px;pointer-events:none;z-index:50;opacity:0;transform:translate(-50%,-50%) rotate(-2deg) scale(.9);transition:opacity .25s,transform .35s var(--ease)}
.peek.on{opacity:1;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}
.peek img{width:100%;display:block;box-shadow:0 18px 40px #0004}

/* pie */
.colophon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:3px double var(--ink);margin-top:10px}
.colophon section{padding:26px 26px 30px 0}
.colophon section+section{padding-left:26px;border-left:1px solid var(--rule)}
.colophon h3{font:800 28px/1 var(--head);margin:0 0 12px}
.colophon p,.colophon li{font:400 15px/1.55 var(--text);color:var(--ink)}
.colophon ul{list-style:none;margin:0;padding:0}
.colophon li{padding:8px 0;border-top:1px solid var(--rule)}
.colophon li .d{display:block;font:500 12px/1 var(--mono);color:var(--muted);margin-bottom:4px}
.btn{display:inline-block;font:600 13px/1 var(--mono);border:1px solid var(--ink);padding:11px 14px;margin-top:6px;transition:background .25s,color .25s}
.btn:hover{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--ink);padding:14px 0 30px;font:400 12px/1.4 var(--mono);color:var(--muted)}

/* ===== artículo ===== */
.progress{position:fixed;left:0;top:0;height:3px;z-index:70;background:var(--mark);width:0;z-index:60}
.art{max-width:1320px;margin:0 auto}
.art-head{max-width:980px;margin:0 auto;text-align:center;padding:46px 0 26px}
.art-head h1{font:900 clamp(60px,9vw,132px)/.84 var(--head);margin:16px 0 20px;letter-spacing:-.015em}
.art-head .deck{margin:0 auto 24px;max-width:36ch}
.art-head .byline{justify-content:center;max-width:620px;margin:0 auto}
.art-hero{margin:30px auto 0;max-width:1180px}
.art-hero img{width:100%;max-height:72vh;object-fit:cover;display:block}
.body{max-width:680px;margin:40px auto 0;font:400 20px/1.7 var(--text)}
.body p{margin:0 0 22px}
.body>p:first-of-type:first-letter{initial-letter:3;-webkit-initial-letter:3;font-family:var(--head);font-weight:900;margin-right:10px;color:var(--ink)}
.pull{position:relative;margin:38px -60px;padding:22px 0 22px 0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);font:800 clamp(34px,3.6vw,48px)/1 var(--head);color:var(--mark);letter-spacing:-.005em;text-wrap:balance}
.body figure{margin:36px -120px}
.body figure.narrow{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:end;margin:34px 0 34px -190px}
.body figure.narrow.r{grid-template-columns:minmax(0,1fr) 330px;margin:34px -190px 34px 0}
.body figure.narrow.r img{order:2}
.body figure.narrow.r figcaption{text-align:right}
.body figure.narrow img{max-height:440px;object-fit:cover}
.body figure.narrow figcaption{border-top:0;padding:0 0 4px;font-size:12px}
.body figure.narrow figcaption:before{content:'';display:block;width:28px;height:3px;background:var(--mark);margin-bottom:10px}
.body figure.narrow.r figcaption:before{margin-left:auto}
.body figure:not(.narrow) img{max-height:76vh;object-fit:cover}
.body .pull{clear:both}
.trip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:40px -190px}
.trip figure{margin:0!important}
.trip img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:transform .9s var(--ease)}
.trip .fr{overflow:hidden}
.trip figure:hover img{transform:scale(1.05)}
.trip figcaption{display:flex;gap:10px;align-items:baseline}
.trip figcaption b{font:900 30px/1 var(--head);color:var(--mark)}
.trip-title{grid-column:1/-1;display:flex;justify-content:space-between;border-top:3px solid var(--ink);padding-top:8px;font:500 12px/1 var(--mono);color:var(--muted)}
.body figure img{width:100%;display:block}
.fin{text-align:center;margin:40px 0 0}
.fin:after{content:"";display:inline-block;width:12px;height:12px;background:var(--ink)}
.next{max-width:980px;margin:56px auto 30px;border-top:3px double var(--ink);padding-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.next b{font:900 clamp(36px,4vw,60px)/.9 var(--head)}
.only-es{max-width:680px;margin:30px auto 0;font:500 13px/1.5 var(--mono);color:var(--accent);border:1px solid var(--mark);padding:10px 14px}

.pull:before{content:'«';position:absolute;left:-.62em;top:.32em;font:900 1.6em/1 var(--head);color:var(--mark)}
.pull{color:var(--ink)!important}
/* foto */
.ph{position:relative;flex:none;overflow:hidden;background:var(--paper-2)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph img.c{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease)}
.ph:hover img.c,a:hover .ph img.c{opacity:1}
.ph.sm{width:50px;height:62px}.ph.md{width:76px;height:95px}
/* botón edición */
.pill{display:inline-flex!important;gap:7px;align-items:center;border:1px solid var(--ink)!important;border-radius:99px;padding:6px 12px 6px 9px!important;transition:background .25s,color .25s}
.pill:hover{background:var(--ink);color:var(--paper)!important}
.pill svg{width:13px;height:13px;flex:none}
/* barra fija */
.minibar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--paper);border-top:3px solid var(--mark);border-bottom:1px solid var(--ink);transform:translateY(-110%);transition:transform .45s var(--ease),background .45s}
.minibar.on{transform:none}
.minibar .wrap{display:flex;align-items:center;gap:22px;height:50px}
.mb-brand{font:900 24px/1 var(--head);white-space:nowrap}
.mb-nav{display:flex;gap:20px;font:500 14px/1 var(--mono);overflow-x:auto;scrollbar-width:none;flex:1}
.mb-nav a{white-space:nowrap;position:relative;padding:3px 0}
.mb-tools{display:flex;gap:10px;align-items:center;font:500 12px/1 var(--mono)}
.mb-menu{display:none;font:600 12px/1 var(--mono);border:1px solid var(--ink);border-radius:99px;padding:9px 12px}
.icon-btn{width:32px;height:32px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:14px;height:14px}
/* páginas */
.page-head{max-width:1000px;margin:0 auto;text-align:center;padding:46px 0 10px}
.page-head h1{font:900 clamp(56px,8vw,118px)/.86 var(--head);margin:16px 0 20px;letter-spacing:-.015em;text-wrap:balance}
.page-head .deck{margin:0 auto 10px;max-width:40ch}
.about{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:52px;max-width:1120px;margin:34px auto 0;align-items:start}
.about .ph{width:100%;aspect-ratio:3/4;height:auto}
.about figcaption{margin-top:8px}
.bio p{font:400 20px/1.66 var(--text);margin:0 0 18px}
.bio .pull{margin:30px 0}
.cv{max-width:1120px;margin:20px auto 0}
.cv-block{border-top:3px solid var(--ink);padding-top:12px;margin-top:40px}
.cv-block h2{font:800 34px/1 var(--head);margin:0 0 6px}
.cv-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;padding:16px 0;border-bottom:1px solid var(--rule)}
.cv-row .when{font:500 12px/1.5 var(--mono);color:var(--muted);padding-top:4px}
.cv-row .what{font:600 19px/1.3 var(--text)}
.cv-row .where{font:500 12px/1.4 var(--mono);color:var(--accent);margin:4px 0 6px}
.cv-row p{margin:0;font:400 16px/1.55 var(--text);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0}
.tags span{font:500 12px/1 var(--mono);border:1px solid var(--rule);padding:8px 10px}
.cv-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 36px}
.research{max-width:1120px;margin:20px auto 0}
.r-intro{max-width:680px;margin:30px auto 0;font:400 20px/1.7 var(--text)}
.r-intro p{margin:0 0 20px}
.frame3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid var(--ink);margin-top:44px}
.frame3>div{padding:18px 24px 26px 0}
.frame3>div+div{padding-left:24px;border-left:1px solid var(--rule)}
.frame3 .who{font:900 36px/.9 var(--head);margin:6px 0 10px}
.frame3 p{margin:0;font:400 16px/1.55 var(--text)}
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin:50px 0 10px}
.split>div{padding:22px 26px}
.split>div+div{border-left:1px solid var(--ink);background:var(--ira-bg);color:var(--ira-text);font-family:'Schibsted Grotesk',sans-serif}
.split h3{font:800 28px/1 var(--head);margin:0 0 10px}
.split>div+div h3{font:900 28px/1 'Schibsted Grotesk';letter-spacing:-.04em}
.split p{margin:0 0 14px;font:400 16px/1.55 var(--text)}
.split>div+div p{font:500 15px/1.5 'Schibsted Grotesk';color:var(--ira-dim)}
.cite{max-width:680px;margin:44px auto 0;border:1px solid var(--rule);padding:16px 18px}
.cite .lbl{display:flex;justify-content:space-between;align-items:center;font:600 12px/1 var(--mono);color:var(--accent);margin-bottom:10px}
.cite p{margin:0;font:400 14px/1.6 var(--mono)}
.cite button{font:500 12px/1 var(--mono);border:1px solid var(--ink);padding:7px 10px}
.cite button:hover{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.contact>a,.contact .mail{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 14px/1.3 var(--mono);padding:10px 0;border-top:1px solid var(--rule)}
.contact h3 a{font:inherit}
.links{display:flex;flex-wrap:wrap;gap:24px;padding:14px 0 0;border-top:1px solid var(--rule);font:500 14px/1.3 var(--mono)}
.contact .mail button{font:500 12px/1 var(--mono);border:1px solid var(--ink);padding:6px 8px}
.contact .mail button:hover{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.replay{font:500 12px/1 var(--mono);color:var(--accent);margin-top:6px;display:inline-block}
a.ira-row{transition:background .25s,padding .25s}
a.ira-row:hover{background:#0f2928;padding-left:8px;padding-right:8px;margin:0 -8px}
.ticker-line a{padding:0 26px;border-left:1px solid var(--rule)}

.ticker-line a:hover{color:var(--accent)}
/* errata corregida */
/* reveal + toasts */
.reveal{opacity:0;transform:translateY(16px);filter:blur(3px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.reveal.in{opacity:1;transform:none;filter:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--paper);font:500 13px/1.4 var(--mono);padding:12px 16px;z-index:80;transition:.4s var(--ease);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* carga: imprenta */
.boot .rule-thick,.boot .rule-thin{transform:scaleX(0)}
.rule-thick,.rule-thin{transition:transform 1.1s var(--ease)}
.boot .brand .l{opacity:0;transform:translateY(.25em)}
.brand{transition:font-size .6s var(--ease),padding .6s var(--ease)}
body.is-art .brand{font-size:clamp(40px,4.6vw,66px);padding:10px 0 8px}
.brand .l{transition:opacity .6s var(--ease),transform .7s var(--ease)}

/* transiciones */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.reprint::view-transition-new(root){animation:reprint .9s var(--ease) both}
@keyframes reprint{from{clip-path:circle(0 at var(--x,50%) var(--y,0))}to{clip-path:circle(150vmax at var(--x,50%) var(--y,0))}}
html.turn::view-transition-old(root){animation:turnout .45s var(--ease) both}
html.turn::view-transition-new(root){animation:turnin .6s .1s var(--ease) both}
@keyframes turnout{to{opacity:0;transform:translateX(-3%)}}
@keyframes turnin{from{opacity:0;transform:translateX(3%)}}
::view-transition-group(headline){animation-duration:.6s;animation-timing-function:var(--ease)}

@media (max-width:980px){
  .about{grid-template-columns:minmax(0,1fr);gap:28px}.about .ph{max-width:420px}
  .cv-cols{grid-template-columns:minmax(0,1fr)}
  .frame3,.split{grid-template-columns:minmax(0,1fr)}.frame3>div+div{padding-left:0;border-left:0;border-top:1px solid var(--rule)}.split>div+div{border-left:0;border-top:1px solid var(--ink)}
  .front{grid-template-columns:minmax(0,1fr);gap:28px}
  .lead,.side{grid-column:1}.vrule{display:none}
  .feature{grid-template-columns:minmax(0,1fr)}
  .colophon{grid-template-columns:minmax(0,1fr)}
  .colophon section+section{padding-left:0;border-left:0;border-top:1px solid var(--rule)}
  .trip{margin:30px 0}
  .pull{margin:30px 0 30px .5em}.body figure{margin:30px 0}.body figure.narrow,.body figure.narrow.r{margin:30px 0;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .lead-grid{grid-template-columns:1fr;margin-top:30px}.col-byline{border-left:0;padding-left:0;flex-direction:row;align-items:center;gap:14px;border-top:1px solid var(--rule);padding-top:16px}.photo.big{width:56px;height:66px}
}
@media (max-width:640px){
  .pq{grid-template-columns:28px minmax(0,1fr);gap:4px 8px}
  .headline{line-height:1.32;padding-top:.3em}.gl-l{bottom:calc(100% - .23em);padding-bottom:5px}.gl-l:after{height:4px}
  .strip .mid{display:none}
  .brand{white-space:normal;font-size:clamp(50px,17vw,80px);line-height:.84}
  .nav{justify-content:flex-start;overflow-x:auto;gap:20px;padding-bottom:12px;mask-image:linear-gradient(90deg,#000 80%,transparent);scrollbar-width:none;padding-right:40px}
  .cv-row{grid-template-columns:minmax(0,1fr);gap:4px}
  .mb-brand{font-size:20px}.minibar .wrap{justify-content:space-between;flex-wrap:wrap;height:auto;min-height:50px;padding-top:8px;padding-bottom:8px}.mb-menu{display:inline-block}
  .mb-nav{display:none;order:3;flex-basis:100%;flex-direction:column;gap:0;font-size:15px;padding:6px 0 4px}.mb-nav a{padding:12px 0;border-top:1px solid var(--rule)}
  .minibar.open .mb-nav{display:flex}
  .nav a{white-space:nowrap}
  .cols{columns:1}
  .row{grid-template-columns:34px minmax(0,1fr);gap:4px 10px}
  .row .typ{grid-column:2}.row .t{grid-column:2}.row .pg{display:none}
  .body{font-size:18px}
  .trip{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.trip figcaption{flex-direction:column;gap:4px;font-size:10px}.trip figcaption b{font-size:22px}
  .body figure.narrow,.body figure.narrow.r{grid-template-columns:1fr;margin:28px 0}.body figure.narrow.r img{order:0}.body figure.narrow.r figcaption{text-align:left}.body figure.narrow.r figcaption:before{margin-left:0}
  .foot{flex-direction:column;align-items:flex-start}
}
