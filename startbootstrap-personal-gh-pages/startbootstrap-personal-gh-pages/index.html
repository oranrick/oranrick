function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}
function wire(){
 document.querySelectorAll('a[data-id]:not(.w)').forEach(a=>{a.classList.add('w');a.addEventListener('click',e=>{e.preventDefault();const id=a.dataset.id;if(a.dataset.word)pendingWord=a.dataset.word;if(ART[id]||PAGES[id])go('#'+id,id);else toast(t('soon'))})});
 const cp=async(txt,ok)=>{try{await navigator.clipboard.writeText(txt);toast(ok)}catch(e){toast(t('copyFail'))}};
 const cm=document.getElementById('copyMail');if(cm)cm.onclick=()=>cp('oranrick@gmail.com',t('copied'));
 const cb=document.getElementById('citeBtn');if(cb)cb.onclick=()=>cp(document.getElementById('citeTxt').textContent,t('citeOk'));
 document.querySelectorAll('.ix:not(.w)').forEach(b=>{b.classList.add('w');b.onclick=()=>openWord(b.dataset.w)});
 const pc=document.getElementById('pcard');if(pc&&!pc._w){pc._w=1;pc.onclick=()=>pc.classList.toggle('flip')}
 const nfh=document.getElementById('nfHome');if(nfh)nfh.onclick=e=>{e.preventDefault();go('#')};
 const lt=document.getElementById('letter');if(lt&&!lt._w){lt._w=1;lt._t0=Date.now();lt._human=false;
  ['keydown','pointerdown','paste','touchstart'].forEach(ev=>lt.addEventListener(ev,e=>{if(e.isTrusted)lt._human=true},{passive:true}));
  lt.onsubmit=e=>{e.preventDefault();const es=lang==='es';const b=lt.querySelector('#ltBody'),n=lt.querySelector('#ltName'),m=lt.querySelector('#ltMail'),hp=lt.querySelector('#ltHp');let ok=true;
  const exito=()=>{lt.classList.add('sent');setTimeout(()=>{document.getElementById('ltDone').textContent=es?`Carta recibida, ${n.value.trim()}. Te respondo a ${m.value.trim()}.`:`Letter received, ${n.value.trim()}. I will reply to ${m.value.trim()}.`},1500)};
  const robot=hp.value!==''||!lt._human||Date.now()-lt._t0<3000||/https?:|www\./i.test(n.value);
  if(robot){const btn=lt.querySelector('.lt-send');btn.disabled=true;exito();return}
  const set=(id,msg)=>{document.getElementById(id).textContent=msg;if(msg)ok=false};
  const txt=b.value.trim();set('errBody',txt.length<10||sinSentido(txt)?(es?'Escribe al menos una frase que se entienda.':'Write at least one sentence that makes sense.'):(txt.match(/https?:\/\/|www\./gi)||[]).length>1?(es?'Incluye como mucho un enlace.':'Include one link at most.'):'');
  set('errName',!n.value.trim()?(es?'Firma la carta.':'Sign the letter.'):'');
  set('errMail',!/^\S+@\S+\.\S+$/.test(m.value.trim())?(es?'Necesito un correo válido para responderte.':'I need a valid email to reply.'):'');
  if(!ok)return;let envs=[];try{envs=JSON.parse(localStorage.getItem('rgr-cartas')||'[]').filter(x=>Date.now()-x<36e5)}catch(e){}
  if(envs.length>=3){document.getElementById('ltDone').textContent=es?'Ya me enviaste varias cartas. Dame un rato para leerlas y vuelve a intentarlo en una hora.':'You have already sent me several letters. Give me time to read them and try again in an hour.';return}
  const btn=lt.querySelector('.lt-send');btn.disabled=true;btn.textContent=es?'Enviando…':'Sending…';
  fetch('https://formsubmit.co/ajax/oranrick@gmail.com',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({name:n.value.trim(),email:m.value.trim(),message:txt,_subject:'Carta desde oranrick.com',_template:'table',_honey:hp.value,_blacklist:'casino,crypto,bitcoin,viagra,cialis,backlinks,seo services,porn,loan,forex,escort'})})
  .then(r=>{if(!r.ok)throw new Error(r.status);try{envs.push(Date.now());localStorage.setItem('rgr-cartas',JSON.stringify(envs))}catch(e){}exito()})
  .catch(()=>{btn.disabled=false;btn.textContent=es?'Echar al buzón':'Post it';document.getElementById('ltDone').textContent=es?'No se pudo enviar. Escríbeme directamente a oranrick@gmail.com.':'It could not be sent. Write to me directly at oranrick@gmail.com.'})};
  lt.querySelectorAll('textarea,input').forEach(f=>f.addEventListener('input',()=>{const map={ltBody:'errBody',ltName:'errName',ltMail:'errMail'};document.getElementById(map[f.id]).textContent=''}))}
 if(document.getElementById('conc')&&pendingWord){const w=pendingWord;pendingWord=null;setTimeout(()=>{openWord(w);document.getElementById('indice-palabras').scrollIntoView({behavior:'smooth'})},450)}
 const cv=document.getElementById('cvBtn');if(cv)cv.onclick=()=>toast(t('cvSoon'));
 const rp=document.getElementById('replayBtn');if(rp)rp.onclick=()=>{played=false;if(location.hash.length>1){go('#')}else{render();scrollTo({top:0,behavior:'smooth'})}};
 document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{e.preventDefault();const tgt=a.dataset.goto;const doScroll=()=>{const el=document.getElementById(tgt);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};if(location.hash.length>1&&tgt!=='cartas'){go('#');setTimeout(doScroll,700)}else doScroll()});
 const peek=document.getElementById('peek'),pimg=peek.querySelector('img');
 view.querySelectorAll('.row').forEach(r=>{r.addEventListener('mouseenter',()=>{if(r.dataset.img){pimg.src=r.dataset.img;peek.classList.add('on')}});r.addEventListener('mouseleave',()=>peek.classList.remove('on'));r.addEventListener('mousemove',e=>{peek.style.left=Math.min(e.clientX+260,innerWidth-130)+'px';peek.style.top=e.clientY+'px'})});
}
let skip=false;window.addEventListener('hashchange',()=>{if(skip){skip=false;return}render();window.scrollTo({top:0,behavior:'instant'})});
document.getElementById('brand').addEventListener('click',e=>{e.preventDefault();if(location.hash.length>1)go('#');else window.scrollTo({top:0,behavior:'smooth'})});

const SUN='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>';
const MOONI=document.querySelector('.tico').innerHTML;
function setIcons(){const n=document.documentElement.dataset.theme==='night';document.querySelectorAll('.tico').forEach(x=>x.innerHTML=n?SUN:MOONI)}
const mbm=document.getElementById('mbMenu');mbm.addEventListener('click',()=>{const o=!mb.classList.contains('open');mb.classList.toggle('open',o);mbm.setAttribute('aria-expanded',o)});
document.querySelectorAll('.mb-nav a').forEach(a=>a.addEventListener('click',()=>{mb.classList.remove('open');mbm.setAttribute('aria-expanded','false')}));
document.getElementById('mbTheme').addEventListener('click',()=>document.getElementById('themeToggle').click());
document.getElementById('mbBrand').addEventListener('click',e=>{e.preventDefault();if(location.hash.length>1)go('#');else scrollTo({top:0,behavior:'smooth'})});
/* barra fija al bajar */
const mb=document.getElementById('minibar');
addEventListener('scroll',()=>{const on=document.querySelector('.ticker').getBoundingClientRect().bottom<0;if(on!==mb.classList.contains('on')){mb.classList.toggle('on',on);if(!on)mb.classList.remove('open');mb.setAttribute('aria-hidden',!on);mb.querySelectorAll('a,button').forEach(x=>x.tabIndex=on?0:-1)}},{passive:true});
/* edición día / noche: la página se reimprime */
document.getElementById('themeToggle').addEventListener('click',e=>{
 const btn=e.currentTarget,r=btn.getBoundingClientRect(),h=document.documentElement;
 h.style.setProperty('--x',r.left+r.width/2+'px');h.style.setProperty('--y',r.top+r.height/2+'px');
 const flip=()=>{h.dataset.theme=h.dataset.theme==='night'?'day':'night';btn.setAttribute('aria-pressed',h.dataset.theme==='night');setI18n();wire();setIcons()};
 if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches)return flip();
 h.classList.add('reprint');document.startViewTransition(flip).finished.finally(()=>h.classList.remove('reprint'));
});
document.getElementById('langToggle').addEventListener('click',()=>{lang=lang==='es'?'en':'es';render()});

/* vinilo que gira al leer */
addEventListener('scroll',()=>{const v=document.getElementById('vinyl');if(v)v.style.transform=`translateX(${Math.min(innerWidth<640?40:110,scrollY*.25)}px) rotate(${scrollY*.4}deg)`},{passive:true});
/* progreso de lectura */
addEventListener('scroll',()=>{const p=document.getElementById('progress');if(!document.querySelector('.art')){p.style.width=0;return}const h=document.documentElement;p.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* cabecera: entra como una rotativa */
const brand=document.getElementById('brand');brand.innerHTML=brand.textContent.split(' ').map(w=>`<span class="l">${w}</span>`).join(' ');
render();
requestAnimationFrame(()=>{document.querySelectorAll('.brand .l').forEach((l,i)=>l.style.transitionDelay=(.25+i*.12)+'s');setTimeout(()=>document.body.classList.remove('boot'),60)});
</script>
</body>
