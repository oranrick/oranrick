<!doctype html>
<html lang="es" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%277%27 fill=%27%23EC4A17%27/%3E%3Ctext x=%2732%27 y=%2745%27 text-anchor=%27middle%27 font-family=%27Arial Narrow,Arial,sans-serif%27 font-weight=%27900%27 font-size=%2734%27 letter-spacing=%27-2%27 fill=%27%2317140F%27%3ERG%3C/text%3E%3C/svg%3E">
<title>Ricardo Grisales Ramírez</title>
<meta name="description" content="Periodista e investigador. Analizo el lenguaje político: qué promete, qué oculta y a quién deja fuera. Ensayos, críticas e IRA, el Índice de Resonancia Afectiva.">
<meta property="og:title" content="Ricardo Grisales Ramírez">
<meta property="og:description" content="Analizo las palabras. Ensayos, críticas e investigación sobre el lenguaje político.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oranrick.com/">
<meta property="og:image" content="https://oranrick.com/img/rick-full-bw.jpg">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#F3EFE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@500;700;800;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Schibsted+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EFE6;--paper-2:#EAE4D8;--ink:#17140F;--muted:#6A6359;--rule:#CFC6B6;--mark:#EC4A17;--accent:#B83210;--on-mark:#17140F;
  --head:'Sofia Sans Extra Condensed','Arial Narrow',sans-serif;--text:'Literata',Georgia,serif;--mono:'Libre Franklin','Franklin Gothic Medium','Helvetica Neue',Arial,sans-serif;
  --ira-bg:#061716;--ira-line:#173130;--ira-text:#F2F5F2;--ira-dim:#9DB0AE;--ira-gold:#DCB149;--ira-sage:#8DAA7E;
  --ease:cubic-bezier(.2,.75,.15,1);
}
html[data-theme=night]{--paper:#12110E;--paper-2:#1B1915;--ink:#ECE5D7;--muted:#A69D8E;--rule:#38332C;--mark:#FF7547;--accent:#FF7547;--on-mark:#12110E}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
[id]{scroll-margin-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px}
::selection{background:var(--mark);color:var(--on-mark)}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}
.mono{font-family:var(--mono)}

/* ===== cabecera ===== */
.strip{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0 10px;font:500 12px/1 var(--mono);color:var(--muted)}
.strip .mid{text-align:center;font:italic 400 14px/1.2 var(--mono);color:var(--muted)}
.strip button{font:500 12px/1 var(--mono);color:var(--ink);padding:4px 0;position:relative}
.strip button b{font-weight:500;color:var(--accent)}
.masthead{position:relative;text-align:center;padding:6px 0 0}
.rule-thick,.rule-thin{height:0;border:0;margin:0;transform-origin:center}
.rule-thick{border-top:5px solid var(--mark)}
.rule-thin{border-top:1px solid var(--ink)}
.brand{display:block;font:900 clamp(54px,10.6vw,158px)/.82 var(--head);letter-spacing:-.012em;padding:14px 0 10px;white-space:nowrap}
.brand .l{display:inline-block}
.nav{display:flex;justify-content:center;gap:clamp(14px,3vw,40px);padding:11px 0;font:500 15px/1 var(--mono);border-bottom:1px solid var(--rule)}
.nav a{position:relative;padding:3px 0}
.ticker{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--ink);padding:9px 0;overflow:hidden}
.ticker-label{flex:none;font:700 12px/1 var(--mono);color:var(--on-mark);background:var(--mark);padding:6px 9px 5px;text-transform:uppercase;letter-spacing:.07em}
.ticker-track{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker-line{display:inline-flex;align-items:center;white-space:nowrap;font:400 14px/1 var(--mono);color:var(--ink);animation:marquee 90s linear infinite}

.ticker-line b{font-weight:700;color:var(--accent);margin-right:8px;text-transform:uppercase;letter-spacing:.06em;font-size:.82em}

.ticker:hover .ticker-line{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}

/* subrayado a mano */
.ink{position:relative;display:inline;background:linear-gradient(var(--mark),var(--mark)) 0 100%/0 1.5px no-repeat;padding-bottom:3px;transition:background-size .45s var(--ease)}
.ink:hover,a:hover .ink,.ink.on{background-size:100% 1.5px}
.row:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--mark);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.row:hover:after{transform:scaleX(1)}
.row>svg{position:absolute;left:0;bottom:-5px;width:100%;height:9px;overflow:visible;pointer-events:none}
.row>svg path{stroke-width:2}
.nowrap{white-space:nowrap}

/* ===== portada ===== */
.front{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 1px minmax(300px,.92fr);gap:0 32px;padding:34px 0 40px;border-bottom:3px double var(--ink)}
.lead{grid-column:1/3}
.vrule{grid-column:3;background:var(--rule)}
.side{grid-column:4}
.kicker{font:700 12px/1 var(--mono);color:var(--accent);letter-spacing:.07em;text-transform:uppercase}
.headline{font:900 clamp(64px,8.6vw,132px)/.84 var(--head);letter-spacing:-.015em;margin:14px 0 0}
.gl{position:relative;display:inline-block}
.gl-l{position:absolute;left:.02em;right:.02em;bottom:calc(100% + 1px);padding-bottom:7px;color:var(--accent);white-space:nowrap;line-height:1;opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0s);pointer-events:none}
.gl-l i{display:block;font:600 clamp(10px,.9vw,12.5px)/1 var(--mono);letter-spacing:.08em;font-style:normal}
.gl-l:after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;border:1.5px solid var(--mark);border-bottom:0;transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease);transition-delay:calc(var(--d,0s) + .15s)}
.headline.glossed .gl-l{opacity:1;transform:none}.headline.glossed .gl-l:after{transform:none}
.headline{padding-top:.32em}
.swap{position:relative;display:inline-block;vertical-align:bottom;white-space:nowrap;transition:width .5s var(--ease)}
.swap .w{display:inline-block;position:relative;transition:transform .5s var(--ease),opacity .4s var(--ease),color .9s var(--ease)}
.swap .w.nx{position:absolute;left:0;top:0;transform:translateY(.45em);opacity:0;color:var(--mark)}
.swap .w.nx.in{transform:none;opacity:1}
.swap .w.out{transform:translateY(-.4em);opacity:0}
.swap .w:after{content:'';position:absolute;left:-2%;right:-2%;top:54%;height:.075em;border-radius:99px;background:var(--mark);transform:scaleX(0) rotate(-1.2deg);transform-origin:left;transition:transform .32s var(--ease)}
.swap .w.struck:after{transform:scaleX(1) rotate(-1.2deg)}
.swap .w.struck{color:var(--muted)}
.deck{font:italic 400 clamp(19px,1.7vw,23px)/1.42 var(--text);color:var(--muted);max-width:34ch;margin:0 0 22px}
.byline{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:22px}
.photo{width:52px;height:60px;flex:none;background:radial-gradient(circle,var(--ink) 1.1px,transparent 1.4px) 0 0/5px 5px;opacity:.55;display:grid;place-items:end center;font:500 10px/1 var(--mono);color:var(--paper);filter:grayscale(1)}
.byline .who{font:600 15px/1.2 var(--text)}
.byline .what{font:400 12px/1.4 var(--mono);color:var(--muted);margin-top:3px}
.lead-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:30px;align-items:start;margin-top:40px;padding-bottom:22px;margin-bottom:24px;border-bottom:1px solid var(--rule)}
.lead-grid .deck{max-width:none;margin:0;font-size:clamp(20px,1.85vw,25px)}
.col-byline{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--rule);padding-left:22px}
.col-byline .who{font:600 15px/1.25 var(--text)}
.col-byline .what{font:400 12px/1.45 var(--mono);color:var(--muted);margin-top:4px}
.photo.big{width:72px;height:86px;background-size:6px 6px}
.cols{columns:2;column-gap:32px;column-rule:1px solid var(--rule);font:400 17px/1.62 var(--text);hyphens:auto}
.cols p{margin:0 0 12px}
.cols p:first-child:first-letter{initial-letter:3;-webkit-initial-letter:3;font-family:var(--head);font-weight:900;margin-right:8px;color:var(--ink)}
.cols .sign{font-style:italic;margin-top:18px}
.firma-w{display:block;margin-top:6px;color:var(--ink);break-inside:avoid}
.firma-w .firma{display:block;width:min(230px,70%);height:auto;overflow:visible}
.sign.reveal{filter:none;transform:none}
.sign.reveal .firma{clip-path:inset(-10% 100% -10% 0)}
.sign.reveal.in .firma{animation:escribir 1.9s .35s cubic-bezier(.55,.05,.35,1) both}
@keyframes escribir{from{clip-path:inset(-10% 100% -10% 0)}to{clip-path:inset(-10% -2% -10% 0)}}
.foot-l{display:flex;align-items:center;gap:12px}
.foot-firma{color:var(--mark);display:inline-flex}
.foot-firma .firma{height:26px;width:auto}
.firma path{stroke:currentColor;stroke-width:.9;stroke-linejoin:round}
.foot-firma .firma path{stroke-width:2.6}
.cols p a .ink{font-weight:500}
.jump{font:500 12px/1 var(--mono);color:var(--accent);display:inline-block;margin-top:4px}

/* IRA */
.side-label{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:14px}
.side-label h2{font:800 30px/1 var(--head);margin:0;letter-spacing:.005em}
.ira{background:var(--ira-bg);color:var(--ira-text);border-radius:6px;padding:20px 20px 16px;font-family:'Schibsted Grotesk',sans-serif;position:relative;overflow:hidden}
.ira-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wordmark{font:900 40px/.8 'Schibsted Grotesk';letter-spacing:-.07em;position:relative}
.wordmark i{position:absolute;left:7px;top:-7px;width:7px;height:7px;border-radius:50%;background:var(--ira-sage);box-shadow:0 0 0 3px #8DAA7E40,0 0 0 7px #8DAA7E18;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 #8DAA7E80,0 0 0 0 #8DAA7E40}100%{box-shadow:0 0 0 7px #8DAA7E00,0 0 0 14px #8DAA7E00}}
.ira-sub{font:500 12px/1.35 'Schibsted Grotesk';color:var(--ira-dim);text-align:right;max-width:15ch}
.ira-q{font:700 24px/1.05 'Schibsted Grotesk';letter-spacing:-.025em;margin:18px 0 14px}
.ira-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 46px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ira-line)}
.ira-row .n{font:700 15px/1.15 'Schibsted Grotesk'}
.ira-row .c{font:500 11px/1.3 'Schibsted Grotesk';color:var(--ira-dim);margin-top:2px}
.ira-row svg{width:90px;height:26px;overflow:visible}
.ira-row svg path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s var(--ease)}
.ira.on svg path{stroke-dashoffset:0}
.ira-row .s{font:900 22px/1 'Schibsted Grotesk';letter-spacing:-.04em;text-align:right}
.scale{height:3px;margin:12px 0 6px;background:linear-gradient(90deg,#8F1C17,#CB4021,#E59236,#DCB149,#8DAA7E)}
.scale-l{display:flex;justify-content:space-between;font:500 11px 'Schibsted Grotesk';color:var(--ira-dim)}
.ira-note{font:400 12px/1.5 var(--mono);color:var(--muted);margin:12px 0 10px}
.ira .ink{background-image:linear-gradient(var(--ira-gold),var(--ira-gold))}
.ira-go{font:700 14px/1 'Schibsted Grotesk';color:var(--ira-gold);display:inline-block;margin-top:14px}

/* en portada */
.section-bar{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding:26px 0 8px;margin-bottom:22px}
.section-bar h2{font:800 clamp(32px,3.4vw,44px)/1 var(--head);margin:0}
.section-bar>span{font:500 12px/1 var(--mono);color:var(--muted)}
.feature{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:36px;padding-bottom:40px;border-bottom:1px solid var(--rule)}
.feature figure{margin:0}
.feature .frame{overflow:hidden;background:#000}
.feature img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.feature a:hover img{transform:scale(1.03)}
figcaption{font:400 12px/1.5 var(--mono);color:var(--muted);margin-top:8px}
.feature h3{font:900 clamp(46px,5vw,76px)/.86 var(--head);margin:12px 0 16px;letter-spacing:-.01em}
.feature p{font:400 18px/1.6 var(--text);margin:0 0 14px}
.feature .deck{margin-bottom:16px}

/* hemeroteca */
.archive{padding-bottom:36px}
.row{display:grid;grid-template-columns:54px 170px minmax(0,1fr) 130px;gap:18px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--rule);position:relative}
.row .num{font:500 13px/1 var(--mono);color:var(--muted)}
.row .typ{font:500 12px/1 var(--mono);color:var(--accent)}
.row .t{font:500 clamp(22px,2.3vw,32px)/1.12 var(--text);letter-spacing:-.01em}
.row .pg{font:500 12px/1 var(--mono);color:var(--muted);text-align:right}
.peek{position:fixed;left:0;top:0;width:230px;pointer-events:none;z-index:50;opacity:0;transform:translate(-50%,-50%) rotate(-2deg) scale(.9);transition:opacity .25s,transform .35s var(--ease)}
.peek.on{opacity:1;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}
.peek img{width:100%;display:block;box-shadow:0 18px 40px #0004}

/* pie */
.colophon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:3px double var(--ink);margin-top:10px}
.colophon section{padding:26px 26px 30px 0}
.colophon section+section{padding-left:26px;border-left:1px solid var(--rule)}
.colophon h3{font:800 28px/1 var(--head);margin:0 0 12px}
.colophon p,.colophon li{font:400 15px/1.55 var(--text);color:var(--ink)}
.colophon ul{list-style:none;margin:0;padding:0}
.colophon li{padding:8px 0;border-top:1px solid var(--rule)}
.colophon li .d{display:block;font:500 12px/1 var(--mono);color:var(--muted);margin-bottom:4px}
.btn{display:inline-block;font:600 13px/1 var(--mono);border:1px solid var(--ink);padding:11px 14px;margin-top:6px;transition:background .25s,color .25s}
.btn:hover{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--ink);padding:14px 0 30px;font:400 12px/1.4 var(--mono);color:var(--muted)}

/* ===== artículo ===== */
.progress{position:fixed;left:0;top:0;height:3px;z-index:70;background:var(--mark);width:0;z-index:60}
.art{max-width:1320px;margin:0 auto}
.art-head{max-width:980px;margin:0 auto;text-align:center;padding:46px 0 26px}
.art-head h1{font:900 clamp(60px,9vw,132px)/.84 var(--head);margin:16px 0 20px;letter-spacing:-.015em}
.art-head .deck{margin:0 auto 24px;max-width:36ch}
.art-head .byline{justify-content:center;max-width:620px;margin:0 auto}
.art-hero{margin:30px auto 0;max-width:1180px}
.art-hero img{width:100%;max-height:72vh;object-fit:cover;display:block}
.body{max-width:680px;margin:40px auto 0;font:400 20px/1.7 var(--text)}
.body p{margin:0 0 22px}
.body>p:first-of-type:first-letter{initial-letter:3;-webkit-initial-letter:3;font-family:var(--head);font-weight:900;margin-right:10px;color:var(--ink)}
.pull{position:relative;margin:38px -60px;padding:22px 0 22px 0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);font:800 clamp(34px,3.6vw,48px)/1 var(--head);color:var(--mark);letter-spacing:-.005em;text-wrap:balance}
.body figure{margin:36px -120px}
.body figure.narrow{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:end;margin:34px 0 34px -190px}
.body figure.narrow.r{grid-template-columns:minmax(0,1fr) 330px;margin:34px -190px 34px 0}
.body figure.narrow.r img{order:2}
.body figure.narrow.r figcaption{text-align:right}
.body figure.narrow img{max-height:440px;object-fit:cover}
.body figure.narrow figcaption{border-top:0;padding:0 0 4px;font-size:12px}
.body figure.narrow figcaption:before{content:'';display:block;width:28px;height:3px;background:var(--mark);margin-bottom:10px}
.body figure.narrow.r figcaption:before{margin-left:auto}
.body figure:not(.narrow) img{max-height:76vh;object-fit:cover}
.body .pull{clear:both}
.trip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:40px -190px}
.trip figure{margin:0!important}
.trip img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:transform .9s var(--ease)}
.trip .fr{overflow:hidden}
.trip figure:hover img{transform:scale(1.05)}
.trip figcaption{display:flex;gap:10px;align-items:baseline}
.trip figcaption b{font:900 30px/1 var(--head);color:var(--mark)}
.trip-title{grid-column:1/-1;display:flex;justify-content:space-between;border-top:3px solid var(--ink);padding-top:8px;font:500 12px/1 var(--mono);color:var(--muted)}
.body figure img{width:100%;display:block}
.fin{text-align:center;margin:40px 0 0}
.fin:after{content:"";display:inline-block;width:12px;height:12px;background:var(--ink)}
.next{max-width:980px;margin:56px auto 30px;border-top:3px double var(--ink);padding-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.next b{font:900 clamp(36px,4vw,60px)/.9 var(--head)}
.only-es{max-width:680px;margin:30px auto 0;font:500 13px/1.5 var(--mono);color:var(--accent);border:1px solid var(--mark);padding:10px 14px}

.pull:before{content:'«';position:absolute;left:-.62em;top:.32em;font:900 1.6em/1 var(--head);color:var(--mark)}
.pull{color:var(--ink)!important}
/* foto */
.ph{position:relative;flex:none;overflow:hidden;background:var(--paper-2)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph img.c{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease)}
.ph:hover img.c,a:hover .ph img.c{opacity:1}
.ph.sm{width:50px;height:62px}.ph.md{width:76px;height:95px}
/* botón edición */
.pill{display:inline-flex!important;gap:7px;align-items:center;border:1px solid var(--ink)!important;border-radius:99px;padding:6px 12px 6px 9px!important;transition:background .25s,color .25s}
.pill:hover{background:var(--ink);color:var(--paper)!important}
.pill svg{width:13px;height:13px;flex:none}
/* barra fija */
.minibar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--paper);border-top:3px solid var(--mark);border-bottom:1px solid var(--ink);transform:translateY(-110%);transition:transform .45s var(--ease),background .45s}
.minibar.on{transform:none}
.minibar .wrap{display:flex;align-items:center;gap:22px;height:50px}
.mb-brand{font:900 24px/1 var(--head);white-space:nowrap}
.mb-nav{display:flex;gap:20px;font:500 14px/1 var(--mono);overflow-x:auto;scrollbar-width:none;flex:1}
.mb-nav a{white-space:nowrap;position:relative;padding:3px 0}
.mb-tools{display:flex;gap:10px;align-items:center;font:500 12px/1 var(--mono)}
.mb-menu{display:none;font:600 12px/1 var(--mono);border:1px solid var(--ink);border-radius:99px;padding:9px 12px}
.icon-btn{width:32px;height:32px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:14px;height:14px}
/* páginas */
.page-head{max-width:1000px;margin:0 auto;text-align:center;padding:46px 0 10px}
.page-head h1{font:900 clamp(56px,8vw,118px)/.86 var(--head);margin:16px 0 20px;letter-spacing:-.015em;text-wrap:balance}
.page-head .deck{margin:0 auto 10px;max-width:40ch}
.about{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:52px;max-width:1120px;margin:34px auto 0;align-items:start}
.about .ph{width:100%;aspect-ratio:3/4;height:auto}
.about figcaption{margin-top:8px}
.bio p{font:400 20px/1.66 var(--text);margin:0 0 18px}
.bio .pull{margin:30px 0}
.cv{max-width:1120px;margin:20px auto 0}
.cv-block{border-top:3px solid var(--ink);padding-top:12px;margin-top:40px}
.cv-block h2{font:800 34px/1 var(--head);margin:0 0 6px}
.cv-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;padding:16px 0;border-bottom:1px solid var(--rule)}
.cv-row .when{font:500 12px/1.5 var(--mono);color:var(--muted);padding-top:4px}
.cv-row .what{font:600 19px/1.3 var(--text)}
.cv-row .where{font:500 12px/1.4 var(--mono);color:var(--accent);margin:4px 0 6px}
.cv-row p{margin:0;font:400 16px/1.55 var(--text);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0}
.tags span{font:500 12px/1 var(--mono);border:1px solid var(--rule);padding:8px 10px}
.cv-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 36px}
.research{max-width:1120px;margin:20px auto 0}
.r-intro{max-width:680px;margin:30px auto 0;font:400 20px/1.7 var(--text)}
.r-intro p{margin:0 0 20px}
.frame3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid var(--ink);margin-top:44px}
.frame3>div{padding:18px 24px 26px 0}
.frame3>div+div{padding-left:24px;border-left:1px solid var(--rule)}
.frame3 .who{font:900 36px/.9 var(--head);margin:6px 0 10px}
.frame3 p{margin:0;font:400 16px/1.55 var(--text)}
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin:50px 0 10px}
.split>div{padding:22px 26px}
.split>div+div{border-left:1px solid var(--ink);background:var(--ira-bg);color:var(--ira-text);font-family:'Schibsted Grotesk',sans-serif}
.split h3{font:800 28px/1 var(--head);margin:0 0 10px}
.split>div+div h3{font:900 28px/1 'Schibsted Grotesk';letter-spacing:-.04em}
.split p{margin:0 0 14px;font:400 16px/1.55 var(--text)}
.split>div+div p{font:500 15px/1.5 'Schibsted Grotesk';color:var(--ira-dim)}
.cite{max-width:680px;margin:44px auto 0;border:1px solid var(--rule);padding:16px 18px}
.cite .lbl{display:flex;justify-content:space-between;align-items:center;font:600 12px/1 var(--mono);color:var(--accent);margin-bottom:10px}
.cite p{margin:0;font:400 14px/1.6 var(--mono)}
.cite button{font:500 12px/1 var(--mono);border:1px solid var(--ink);padding:7px 10px}
.cite button:hover{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.contact>a,.contact .mail{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 14px/1.3 var(--mono);padding:10px 0;border-top:1px solid var(--rule)}
.contact h3 a{font:inherit}
.links{display:flex;flex-wrap:wrap;gap:24px;padding:14px 0 0;border-top:1px solid var(--rule);font:500 14px/1.3 var(--mono)}
.contact .mail button{font:500 12px/1 var(--mono);border:1px solid var(--ink);padding:6px 8px}
.contact .mail button:hover{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.replay{font:500 12px/1 var(--mono);color:var(--accent);margin-top:6px;display:inline-block}
a.ira-row{transition:background .25s,padding .25s}
a.ira-row:hover{background:#0f2928;padding-left:8px;padding-right:8px;margin:0 -8px}
.ticker-line a{padding:0 26px;border-left:1px solid var(--rule)}

.ticker-line a:hover{color:var(--accent)}
/* errata corregida */
/* reveal + toasts */
.reveal{opacity:0;transform:translateY(16px);filter:blur(3px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.reveal.in{opacity:1;transform:none;filter:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--paper);font:500 13px/1.4 var(--mono);padding:12px 16px;z-index:80;transition:.4s var(--ease);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* carga: imprenta */
.boot .rule-thick,.boot .rule-thin{transform:scaleX(0)}
.rule-thick,.rule-thin{transition:transform 1.1s var(--ease)}
.boot .brand .l{opacity:0;transform:translateY(.25em)}
.brand{transition:font-size .6s var(--ease),padding .6s var(--ease)}
body.is-art .brand{font-size:clamp(40px,4.6vw,66px);padding:10px 0 8px}
.brand .l{transition:opacity .6s var(--ease),transform .7s var(--ease)}

/* transiciones */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.reprint::view-transition-new(root){animation:reprint .9s var(--ease) both}
@keyframes reprint{from{clip-path:circle(0 at var(--x,50%) var(--y,0))}to{clip-path:circle(150vmax at var(--x,50%) var(--y,0))}}
html.turn::view-transition-old(root){animation:turnout .45s var(--ease) both}
html.turn::view-transition-new(root){animation:turnin .6s .1s var(--ease) both}
@keyframes turnout{to{opacity:0;transform:translateX(-3%)}}
@keyframes turnin{from{opacity:0;transform:translateX(3%)}}
::view-transition-group(headline){animation-duration:.6s;animation-timing-function:var(--ease)}

@media (max-width:980px){
  .about{grid-template-columns:minmax(0,1fr);gap:28px}.about .ph{max-width:420px}
  .cv-cols{grid-template-columns:minmax(0,1fr)}
  .frame3,.split{grid-template-columns:minmax(0,1fr)}.frame3>div+div{padding-left:0;border-left:0;border-top:1px solid var(--rule)}.split>div+div{border-left:0;border-top:1px solid var(--ink)}
  .front{grid-template-columns:minmax(0,1fr);gap:28px}
  .lead,.side{grid-column:1}.vrule{display:none}
  .feature{grid-template-columns:minmax(0,1fr)}
  .colophon{grid-template-columns:minmax(0,1fr)}
  .colophon section+section{padding-left:0;border-left:0;border-top:1px solid var(--rule)}
  .trip{margin:30px 0}
  .pull{margin:30px 0 30px .5em}.body figure{margin:30px 0}.body figure.narrow,.body figure.narrow.r{margin:30px 0;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .lead-grid{grid-template-columns:1fr;margin-top:30px}.col-byline{border-left:0;padding-left:0;flex-direction:row;align-items:center;gap:14px;border-top:1px solid var(--rule);padding-top:16px}.photo.big{width:56px;height:66px}
}
@media (max-width:640px){
  .pq{grid-template-columns:28px minmax(0,1fr);gap:4px 8px}
  .headline{line-height:1.32;padding-top:.3em}.gl-l{bottom:calc(100% - .23em);padding-bottom:5px}.gl-l:after{height:4px}
  .strip .mid{display:none}
  .brand{white-space:normal;font-size:clamp(50px,17vw,80px);line-height:.84}
  .nav{justify-content:flex-start;overflow-x:auto;gap:20px;padding-bottom:12px;mask-image:linear-gradient(90deg,#000 80%,transparent);scrollbar-width:none;padding-right:40px}
  .cv-row{grid-template-columns:minmax(0,1fr);gap:4px}
  .mb-brand{font-size:20px}.minibar .wrap{justify-content:space-between;flex-wrap:wrap;height:auto;min-height:50px;padding-top:8px;padding-bottom:8px}.mb-menu{display:inline-block}
  .mb-nav{display:none;order:3;flex-basis:100%;flex-direction:column;gap:0;font-size:15px;padding:6px 0 4px}.mb-nav a{padding:12px 0;border-top:1px solid var(--rule)}
  .minibar.open .mb-nav{display:flex}
  .nav a{white-space:nowrap}
  .cols{columns:1}
  .row{grid-template-columns:34px minmax(0,1fr);gap:4px 10px}
  .row .typ{grid-column:2}.row .t{grid-column:2}.row .pg{display:none}
  .body{font-size:18px}
  .trip{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.trip figcaption{flex-direction:column;gap:4px;font-size:10px}.trip figcaption b{font-size:22px}
  .body figure.narrow,.body figure.narrow.r{grid-template-columns:1fr;margin:28px 0}.body figure.narrow.r img{order:0}.body figure.narrow.r figcaption{text-align:left}.body figure.narrow.r figcaption:before{margin-left:0}
  .foot{flex-direction:column;align-items:flex-start}
}

  ed1:'Esta página tiene un solo periodista. Aquí publico lo que escribo y lo que investigo: ensayos sobre arte y política, críticas de música y análisis del lenguaje político contemporáneo en español. Mi aspiración, como periodista o, mejor dicho, como comunicador, es hacer algún día del lenguaje una herramienta de unidad social y de empatía colectiva.',
  ed2:'Esa vocación estalló con mi trabajo de fin de grado, <i>El contagio de las palabras. Metáforas, empatía y polarización en el discurso político contemporáneo</i> (UCM, 2024), y con una pregunta: ¿por qué unas palabras nos acercan y otras nos separan? Alrededor de ella giran mi trabajo y mi escritura. De ahí nació IRA, el Índice de Resonancia Afectiva, un proyecto independiente que une neurociencia, lingüística y psicología social para estudiar cómo actúa el lenguaje sobre quien lo escucha.',

  ed2:'That calling took off with my undergraduate thesis, <i>The Contagion of Words. Metaphors, empathy and polarization in contemporary political discourse</i> (UCM, 2024), and with one question: why do some words bring us closer while others push us apart? My work and my writing revolve around it. That is where IRA, the Affective Resonance Index, was born: an independent project that brings together neuroscience, linguistics and social psychology to study how language acts on those who listen.',

function trace(s,seed){ // calma = onda suave, polarización = picos

  for(let x=4;x<=90;x+=4){const r=Math.sin(x*.37+seed)*.5+Math.sin(x*.11*freq+seed*2)*.5;const y=13+(s<5? (x%8?-1:1)*amp*Math.abs(r)+r*2 : r*amp*.8);d+=` L${x} ${y.toFixed(1)}`}
  return d;
}

 engano:{d:'2025-04-05',slug:'poder-mentira',kicker:{es:'Opinión',en:'Opinion'},title:{es:'La política del engaño',en:'The politics of deception'},deck:{es:'¿Puede sobrevivir la democracia a la desinformación?',en:'Can democracy survive disinformation?'},min:6,hero:null,next:'abnegacion',
 body:[
  ['p','Vivimos saturados de datos y, aun así, la verdad ya no parece ser suficiente. La desinformación —alimentada por inteligencia artificial, algoritmos y manipulación emocional— ha convertido el acceso a la información en una batalla permanente.'],
  ['p','La política, desde siempre, ha buscado mediante múltiples mecanismos y ramas llegar a la población. Lo vimos recientemente con la reelección del candidato republicano Donald Trump, en donde la mentira fue la piedra angular de su campaña. El candidato se atribuyó logros de otras administraciones, insultó a su contrincante, mintió continuamente sobre los datos científicos arrojados sobre el cambio climático e incluso mencionó que inmigrantes ilegales haitianos se estaban comiendo las mascotas de la población autóctona de Ohio. El efecto consecuente que se esperaría sería un rechazo hacia su personaje político; sin embargo, estos actos solo impulsaron más su triunfo.'],
  ['q','Estamos viviendo el fin de la democracia tal como la conocíamos.'],
  ['p','La mentira siempre ha estado presente, de eso no queda ninguna duda. Sin embargo, en este crono topos la mentira tiene ventaja sobre nosotros: la polarización, poseída por pasionales arranques de moralidad; el sentimentalismo, cada vez más extremo, en la oratoria política; las redes sociales —que son básicamente altavoces del subconsciente— y ahora se suma la inteligencia artificial, que amplifica las posibilidades de manipulación al crear una realidad paralela, indistinguible de la realidad.'],
  ['q','La verdad se vuelve escurridiza y poco atractiva, le falta ese morbo y esa emocionalidad que tiene su vecina.'],
  ['p','La posibilidad de poder lanzar la piedra sin ser visto; de tirar del gatillo sin dejar huella; de escupir a la cara sin tener represalias: todo esto es lo que el anonimato alimenta, en un entorno donde las narrativas emocionales desplazan los datos objetivos. Hoy en día, la gente se da baños de polarización: el deseo está sobre la razón, el dato ya no mata al relato. Sobre esto, Alberto Barreiro argumenta: "La verdadera batalla que se avecina no será entre conservadores y progresistas, sino entre quienes defienden la autonomía humana y quienes abrazan la visión aristócrata del elitismo tecnocrático".'],
  ['p','La tecnología, lejos de la neutralidad, se ha convertido en un motor clave para la propagación masiva de desinformación. En un mundo hiperconectado, las barreras para crear y difundir contenido falso prácticamente han desaparecido. Un ejemplo claro: los deepfakes, una técnica basada en IA generativa, han sido utilizados para fabricar videos como el de Volodímir Zelenski pidiendo a los ciudadanos ucranianos que se rindieran; o el cheapfake que desacreditó a Nancy Pelosi al alterar su discurso para hacerla parecer ebria. Estas tecnologías hacen posible producir falsificaciones convincentes sin necesidad de equipos costosos ni conocimientos técnicos avanzados, solo se necesita radicalización y emocionalidad.'],
  ['q','La realidad se fragmenta, y ya no sabemos siquiera si lo que nuestros sentidos perciben es real.'],
  ['p','Las redes sociales, con sus algoritmos diseñados para maximizar la interacción, amplifican aún más este problema. Los algoritmos de recomendación refuerzan esta dinámica al crear filtros burbuja y cámaras de eco, encerrando a los usuarios en entornos donde solo se enfrentan a perspectivas que confirman sus creencias.'],
  ['p','El relato tiene una ventaja innegable: se conecta con nuestra tendencia a creer, mientras que los datos suelen obligarnos a cuestionar lo que ya pensamos. En sus estudios sobre el subconsciente, Freud sostenía que las decisiones humanas están fuertemente determinadas por impulsos y temores inconscientes.'],
  ['p','Edward Bernays, conocido como el padre de la propaganda moderna, tomó esta idea y la aplicó de forma brillante para moldear la opinión pública. Uno de los casos más representativos fue la campaña de los años 20 para que las mujeres comenzaran a fumar. Al ligar los cigarrillos con conceptos como libertad y emancipación femenina, logró convertir lo que antes era visto como un hábito prohibido en un símbolo de progreso. En definitiva, su trabajo consistió en transformar a la sociedad: de una ciudadanía que miraba por sus necesidades, a una que miraba por sus deseos irracionales. Ese es el mundo que tenemos hoy.'],
  ['p','Los estudios científicos respaldan este patrón. Investigaciones en neurociencia muestran que las historias estimulan zonas del cerebro asociadas al placer y la empatía —principalmente el sistema límbico—, mientras que las cifras activan partes más racionales, como el córtex prefrontal. Esta diferencia explica por qué un relato cargado de emoción suele quedarnos más grabado que una serie de datos sueltos y fríos.'],
  ['p','La desinformación, alimentada por la tecnología, ha convertido a la verdad en un concepto fragmentado, casi irreconocible, en un mundo saturado de datos. La política, ese arte de llegar a acuerdos, se enfrenta ahora a un desafío monumental: comunicarse en un espacio donde el relato falso no solo compite con la verdad, sino que la supera en atractivo. ¿Cómo puede la democracia adaptarse a un mundo donde la desinformación y las emociones dominan el discurso? Probablemente no haya ninguna respuesta.'],
  ['p','La conclusión, entonces, no es un cierre, sino un inicio. La IA y la tecnología no son inherentemente destructivas, pero su potencial para fragmentar la verdad nos obliga a reflexionar sobre qué tipo de relación queremos construir con ellas. Tal vez la solución no sea eliminar la desinformación por completo —una tarea probablemente utópica—, sino aprender a convivir con ella desarrollando herramientas críticas y éticas que nos permitan distinguir el ruido de lo esencial.'],
  ['q','El amor puede ser el antídoto: no porque sea sencillo o idealizado, sino porque fomenta la empatía, la reflexión y, sobre todo, el compromiso con la verdad y con los otros.'],
  ['p','Carl Jung decía: "Donde el amor reina, no hay voluntad de poder; y donde el poder predomina, el amor falta". Al final, lo que está en juego no es solo la verdad, sino nuestra capacidad de imaginar una democracia que sea resiliente en su imperfección. Y quizá ahí resida la clave: en reconocer que, aunque no podamos controlar todo, todavía podemos decidir cómo enfrentarlo.']
 ]},
 abnegacion:{d:'2025-04-05',slug:'salomon',kicker:{es:'Ensayo, arte barroco',en:'Essay, Baroque art'},title:{es:'La abnegación más pura',en:'The purest devotion'},deck:{es:'Un recorrido por la maternidad en el arte, desde El juicio de Salomón de Luca Giordano.',en:'A walk through motherhood in art, starting from Luca Giordano’s The Judgement of Solomon.'},min:4,
 hero:['img/portada-salo.jpg',{es:'El juicio de Salomón, Luca Giordano. Museo Nacional Thyssen-Bornemisza, Madrid.',en:'The Judgement of Solomon, Luca Giordano. Thyssen-Bornemisza National Museum, Madrid.'}],next:'arte',
 body:[
  ['p','Es difícil recorrer los pasillos del Thyssen sin detenerse a ver esta dramática escena, que, marcada por una iluminación barroca, narra uno de los más citados episodios bíblicos. La pintura recoge el momento principal de El juicio de Salomón.'],
  ['p','El juicio de Salomón cuenta la historia de dos mujeres que recurren al rey Salomón debido a que tienen una disputa: ambas argumentan ser madres de un niño con pocos días de nacido. Tras escuchar los puntos de vista, el rey indica a un guardia que traiga una espada y corte al niño a la mitad, de esta forma, ambas madres recibirán una parte del bebé. Cuando la primera mujer escucha esto, empieza a llorar y le suplica desconsoladamente que por favor le entregue el bebé a la otra mujer, a cambio de que no lo corte. En respuesta, el rey le indica al guardia que le devuelva el bebé a la primera mujer, la verdadera madre.'],
  ['p','En la obra, podemos observar a la verdadera madre arrodillada en el centro de la pintura. Podemos notar su sufrimiento. Pareciera que estuviese en movimiento. Sus ojos están llenos de lágrimas y su expresión grita misericordia. Incluso en su vestimenta, con un desorden desesperado, podemos ver una señal más que muestra la maestría de Giordano en la pintura. Otro elemento precioso son sus manos: abiertas, pidiendo el fin del mundo a cambio de la vida de su primogénito.'],
  ['q','La abnegación más profunda: el amor maternal.'],
  ['p','La iluminación de la obra está uniformemente repartida, aunque se centra adicionalmente en un triángulo fácilmente observable. Uno de los extremos del triángulo lo conforma la verdadera madre. Otro de los puntos de la figura es el bebé, que, aunque inconsciente y poco participativo, es el centro de la historia, el meollo de la disputa, las lágrimas de la madre, la decisión del rey. De cabeza, con un pie coleando y el otro sostenido por un guardia que envaina nuevamente su espada, el bebé no puede hacer nada, más que confiar en la sabiduría del rey y en el lenguaje de su madre.'],
  ['t',[['img/salo-2.jpg','La verdadera madre, vértice suroccidental.'],['img/salo-3.jpg','El bebé con vida, vértice norte.'],['img/salo-4.jpg','El rey Salomón, vértice oriental.']]],
  ['p','El último elemento de este triángulo está representado por el rey Salomón, tan sereno, sabio, prudente y bohemio. Exalta la sabiduría y la justicia que caracteriza el poder político legítimo. Su cuerpo y sus brazos generan movimientos pacíficos y deliberados, muy bien pensados, grandes ejemplos comunicativos. Todos —y todo— lo que está alrededor del rey expresa confianza y esperanza en el monarca.'],
  ['f','img/salo-5.jpg','El bebé muerto, hijo de la segunda mujer, fuera del triángulo.'],
  ['p','Fuera de este triángulo de personajes, el autor incorpora detalles significativos que dotan la obra de complejidad y personalidad. Uno de estos elementos puede ser el bebé que aparece muerto en la parte inferior de la pintura. El recién nacido era hijo de la segunda mujer. En aquella época sería su única esperanza de tener una vida autónoma. En la antigüedad la ley del levirato aún imperaba, esta norma condiciona a las mujeres viudas sin hijos a casarse con el hermano de su difunto esposo.'],
  ['q','El bebé muerto en la obra no es un detalle más que adorna la pintura: explica profundamente parte de la causalidad de la situación.'],
  ['p','En definitiva, la pintura es una escena llena de fuerza, emocionalidad, belleza y significado. Es también un cuadro más en los pasillos del maravilloso Thyssen, pero absolutamente una experiencia histórica que se debe vivir. El juicio de Salomón ha fascinado a las personas durante siglos. Tiene conexiones profundas con la sabiduría, la justicia y la compasión, y su mensaje sigue siendo relevante hoy en día. Giordano representa vívidamente la historia y nos recuerda que, en manos de poder legítimo, la justicia siempre triunfa sobre la injusticia.']
 ]},

 ficha:[['Título','Sincerely'],['Artista','Kali Uchis'],['Fecha','9 de mayo de 2025'],['Sello','Capitol Records / Left Music'],['Producción','Josh Crocker, Kali Uchis, Tom Henry, Dylan Wiggins'],['Géneros','R&B alternativo, dream pop, soul, psicodelia latina']],
 disco:[['2018','Isolation'],['2020','Sin Miedo'],['2023','Red Moon in Venus'],['2024','Orquídeas'],['2025','Sincerely']],
 body:[
  ['p','Kali Uchis se aleja del brillo comercial para ofrecernos su obra más íntima: un álbum nacido entre el duelo y la maternidad, donde cada canción respira honestidad. Sincerely no busca complacer, sino acompañar.'],
  ['h','Un álbum nacido fuera del estudio'],
  ['p','Desde su publicación el 9 de mayo de 2025, el álbum Sincerely se presenta como el proyecto más introspectivo y emocionalmente trabajado de Kali Uchis. La artista estadounidense-colombiana compuso este álbum durante su embarazo y lo terminó poco después del nacimiento de su hijo, en un momento atravesado por la vida y la muerte: la llegada de la maternidad y la pérdida de su madre. Según explicó en entrevista con Zane Lowe, Sincerely fue concebido como "una forma de sanación anticipada": muchas de las letras surgieron incluso antes de que los acontecimientos dolorosos ocurrieran, casi como advertencias del subconsciente.'],
  ['p','La mayoría de los temas nacieron fuera del estudio, escritos desde casa o grabados como notas de voz en momentos espontáneos. "Ninguna canción fue creada en una sesión de estudio tradicional", explicó, reivindicando la libertad creativa de un proceso despojado de la presión industrial.'],
  ['p','Esa decisión se siente en el resultado final: lejos del pulido comercial o de los ganchos diseñados para TikTok, este es un álbum que respira a su propio ritmo y se ofrece como experiencia completa, más cercana a un diario sonoro que a una colección de sencillos.'],
  ['q','Más cercano a un diario sonoro que a una colección de sencillos.'],
  ['h','Letras íntimas, voz contenida'],
  ['p','Ese carácter íntimo se traduce en una escritura lírica radicalmente sincera. Lose My Cool abre una grieta emocional en una de sus últimas estrofas, con una confesión de insomnio y de necesidad del otro. No hay metáforas rebuscadas ni dramatismo impostado, sino una afirmación llana de fragilidad afectiva. El álbum está lleno de confesiones así: en It\'s Just Us, Uchis narra una adolescencia marcada por el abandono, en un verso que resuena más allá del dato biográfico. En All I Can Say, declara con firmeza que nadie va a destruir su paz mental, mostrando una madurez emocional que se impone sin necesidad de agresividad.'],
  ['p','Lejos de la narrativa pop del empoderamiento inmediato, Uchis elige mostrarse humana: vulnerable, pero no rota; dolida, pero no resentida. Su voz, cálida y contenida, se convierte en el hilo conductor de un relato emocional coherente, en el que cada canción aporta una pieza al rompecabezas de una transformación personal que no busca aplausos, sino entendimiento.'],
  ['q','Vulnerable, pero no rota; dolida, pero no resentida.'],
  ['p','Desde el punto de vista sonoro, Sincerely se aleja de los ritmos bailables de Orquídeas y de los ganchos inmediatos de Red Moon in Venus. Aquí no hay coqueteo con la radiofórmula ni colaboraciones estratégicas. Las estructuras musicales no responden a patrones pop convencionales, sino que se pliegan a la lógica interna de cada letra, respetando su respiración y sus silencios.'],
  ['p','Uchis mezcla su ya habitual influencia retro (doo-wop, soul, bolero) con atmósferas más etéreas, cercanas al dream pop. Mencionó influencias tan dispares como Cocteau Twins, Fiona Apple, Amy Winehouse y The Cranberries; y aunque no todas son evidentes en la superficie, sí lo son en la textura emocional del disco.'],
  ['h','Una obra para escuchar despacio'],
  ['p','Ubicar Sincerely dentro de la trayectoria de Kali Uchis implica reconocer un cambio profundo, no solo estilístico, sino vital. Isolation (2018) fue su carta de presentación: una artista joven, camaleónica, con hambre creativa. Sin Miedo (2020) fue su álbum más atrevido en lo sonoro y lo sexual. Red Moon in Venus (2023) empezó a girar el foco hacia lo emocional. Orquídeas (2024) fue celebración y desahogo: fuerza, embarazo, poder y dulzura. Sincerely, en cambio, es silencio, pausa, escucha.'],
  ['p','Escuchar Sincerely no es una experiencia pensada para todos los públicos, ni para cualquier momento. Es un álbum que se despliega mejor en soledad, sin interrupciones, en auriculares o en un espacio donde las emociones puedan tener volumen. No es el disco más comercial de Kali Uchis, ni el más seductor en lo sonoro, pero sí el más coherente, el más honesto, el más lleno de voz, no solo por lo que canta, sino por lo que calla.'],
  ['v','En una industria donde todo parece urgente, Sincerely se permite ser lento, amoroso y necesario. No quiere ser tendencia: quiere ser refugio. Y lo logra.']
 ]},
 arte:{d:'2025-04-04',slug:'arte-naturaleza',layout:'expo',kicker:{es:'Reseña, exposición',en:'Review, exhibition'},title:{es:'Arte y naturaleza',en:'Art and nature'},deck:{es:'Del surrealismo a la crisis ecológica: un siglo de biomorfismo en CaixaForum Madrid.',en:'From Surrealism to the ecological crisis: a century of biomorphism at CaixaForum Madrid.'},min:5,
 hero:['img/portadaarte.jpg',{es:'«Arte y naturaleza. Un siglo de biomorfismo». CaixaForum Madrid, 2024.',en:'“Art and Nature. A Century of Biomorphism”. CaixaForum Madrid, 2024.'}],next:'kali',
 body:[
  ['p','Madrid se convierte en un oasis de vitalismo con la exposición "Arte y naturaleza. Un siglo de biomorfismo". A través de obras de grandes artistas como Pablo Picasso, Salvador Dalí o Charles Le Corbusier, la muestra invita a reflexionar sobre cómo la naturaleza ha inspirado a los artistas a lo largo de un siglo. El comisariado estuvo a cargo de Angela Lampe, doctora en Historia del Arte por la Universidad La Sorbona de París.'],
  ['p','La muestra representa una reflexión entre el arte y la naturaleza, entre cultura y ciencia, principalmente a través del surrealismo. La mayoría de las obras son préstamos del Centre Pompidou, tanto el parisino como el malagueño. Esta masiva exposición cuenta con obras de artistas tan imponentes como Georgia O\'Keeffe, Vasili Kandinski, Jean Dubuffet o Max Ernst. Aunque la mayoría de la exposición está liderada por la pintura, encontramos diferentes soportes que la hacen dinámica, divertida y profunda. Cuatro conceptos la ordenan: metamorfosis, mimetismo, creación y amenaza.'],
  ['sala','Metamorfosis',1],
  ['p','Al iniciar, nos encontramos en metamorfosis: se difumina la línea entre las formas antropomorfas, zoomorfas o vegetales para abrirse a nuevas posibilidades más creativas. Aquí encontramos obras como Femme au chapeau de Pablo Picasso (1935), en donde vemos a una mujer con un rostro distorsionado, símbolo de cambio y transformación, característico de la metamorfosis de la naturaleza.'],
  ['cartela','img/arte-1.jpg',{a:'Yves Tanguy',t:'Le Palais aux rochers de fenêtres',y:'1942',m:'Óleo sobre lienzo'}],
  ['p','Además, encontramos obras como Le Palais aux rochers de fenêtres de Yves Tanguy (1942), en donde vemos una obra dividida en dos: en la parte superior, un cielo orgánico, natural, tranquilo; mientras que en la parte inferior, la relación entre lo mecánico y lo geológico, lo natural y lo inerte. La metamorfosis está presente en el paisaje: cómo ha sido transformado por la modernidad y cómo las montañas pasan a ser una mezcla entre lo salvaje y lo humanamente creado.'],
  ['sala','Mimetismo',2],
  ['p','Posteriormente, pasamos al apartado de mimetismo, donde la naturaleza, en sus diversas formas, se convierte en una fuente de inspiración para los artistas, quienes reproducen sus formas, texturas y movimientos.'],
  ['cartela','img/arte-2.jpg',{a:'Vasili Kandinski',t:'Cielo azul',y:'',m:'Óleo sobre lienzo'}],
  ['p','Encontramos obras como Cielo azul del padre del arte abstracto, Kandinski. En esta obra, vemos extrañas formas biomórficas que flotan sobre un fondo azul celeste; no se puede identificar exactamente qué son, pero, sin duda alguna, podemos ver la intención del autor: expresar emociones y crear una experiencia sensorial a través de su pintura. El objetivo de Kandinski es crear una sensación de movimiento y ligereza, como si estas formas flotaran en el aire.'],
  ['sala','Creación',3],
  ['p','Tras haber visto dos secciones más homogéneas, pasamos a dos que son los polos: creación y amenaza. En creación, observamos la imaginación del pintor moderno en su clímax; los artistas se convierten en dioses, juegan con su experiencia y con la naturaleza, crean nuevas formas exquisitas para la vista.'],
  ['cartela','img/arte-3.jpg',{a:'Richard Deacon',t:'Breed',y:'1989',m:'Madera y masonita estratificadas, aluminio, resina epoxi y pigmentos'}],
  ['p','Así, encontramos por ejemplo Breed de Richard Deacon (1989), un enrevesado engendramiento de apariencia rígida, metálica, pero móvil, libre, fluida. Es una representación de la nueva creación, del nuevo uso de la naturaleza a merced del hombre, del sometimiento de la naturaleza al imaginativo humano, el cual es infinito.'],
  ['sala','Amenaza',4],
  ['p','Finalizando, encontramos amenaza: la sección más fiel a la realidad y la más profunda. Se trata de representar la desgracia traída por el ser humano y su eco en la naturaleza. Esta sección juega más con otros elementos externos al arte plástico; vemos una sala donde continuamente se reproduce un vídeo de aves volando en bandada, desesperadas. Transmite una energía sombría.'],
  ['cartela','img/arte-4.jpg',{a:'Tetsumi Kudo',t:'Pollution-Cultivation-Nouvelle Écologie',y:'1971',m:'Instalación'}],
  ['p','En esta sección, encontramos también Pollution-Cultivation-Nouvelle Écologie de Tetsumi Kudo (1971), en donde observamos diferentes tipos de plantas que contienen circuitos electrónicos en su raíz. Es la representación de la humanidad en decadencia, de la naturaleza contaminada: según el autor, el "antagonismo primitivo" del ser humano contra la naturaleza. Casi al finalizar, nos chocamos con Skin Pool (Gleen) de Pamela Rosenkranz, una gran piscina de un líquido beige, rosa, cremoso: una crítica a cómo el ser humano crea modelos que corrompen tanto lo más humano como el poder bello y transformador de la naturaleza.'],
  ['q','Al salir, la mente está reflexiva, inquieta y maravillada.'],
  ['p','Las cuatro representaciones de la naturaleza son también un recorrido histórico de la relación entre el artista y lo natural. Esta exposición es auténtica, es libre y es potente. La capacidad de la muestra para sumergir al espectador entre esa conexión de lo orgánico y lo mecánico es sutil, pero tiene un trabajo de aplausos detrás de escena. Al salir del recinto la mente está reflexiva, inquieta y maravillada: el pensamiento empieza a conectar la cotidianidad con lo inorgánico.'],
  ['ticket',[['Lugar','CaixaForum Madrid'],['Dirección','P.º del Prado, 36, Madrid'],['Fechas','19 feb – 9 jun 2024'],['Precio','6 €'],['Horario','Todos los días, 10 a 20 h']]]
 ]}
};

function article(id){
 const a=ART[id];
 let nI=0;const body=a.body.map(([k,x,y])=>k==='p'?`<p>${esc(x)}</p>`:k==='q'?`<blockquote class="pull">${esc(x)}</blockquote>`:k==='t'?`<div class="trip"><div class="trip-title"><span>${lang==='es'?'El triángulo de luz':'The triangle of light'}</span><span>${lang==='es'?'Detalles':'Details'}</span></div>${x.map((f,i)=>`<figure><div class="fr"><img src="${f[0]}" alt="${esc(f[1])}" loading="lazy"></div><figcaption><b>${i+1}</b><span>${esc(f[1])}</span></figcaption></figure>`).join('')}</div>`:k==='h'?`<h2 class="ladillo">${esc(x)}</h2>`:k==='v'?`<div class="verdict"><span>${lang==='es'?'Veredicto':'Verdict'}</span><p>${esc(x)}</p></div>`:k==='sala'?`<div class="sala"><span class="sala-n">${lang==='es'?'Sala':'Room'} ${y}</span><h2>${esc(x)}</h2></div>`:k==='cartela'?`<figure class="cartela-fig"><img src="${x}" alt="${esc(y.t)}, ${esc(y.a)}" loading="lazy"><figcaption class="cartela"><b>${esc(y.a)}</b><i>${esc(y.t)}</i>${y.y?`<span>${y.y}</span>`:''}<span>${esc(y.m)}</span></figcaption></figure>`:k==='ticket'?`<div class="ticket"><div class="tk-main"><div class="tk-h">${lang==='es'?'Entrada':'Ticket'}</div><div class="tk-t">Arte y naturaleza</div>${x.map(([a,b])=>`<div class="tk-r"><span>${a}</span>${b}</div>`).join('')}</div></div>`:k==='f'?`<figure><img src="${x}" alt="${esc(y)}" loading="lazy"><figcaption>${esc(y)}</figcaption></figure>`:`<figure class="narrow ${(nI++)%2?'r':''}"><img src="${x}" alt="${esc(y)}" loading="lazy"><figcaption>${esc(y)}</figcaption></figure>`).join('');
 const nx=ART[a.next];
 return `<article class="art">
  <header class="art-head"><div class="kicker">${L(a.kicker)}</div><h1 style="view-transition-name:headline">${L(a.title)}</h1><p class="deck">${L(a.deck)}</p>
  <a class="byline" href="#sobre-mi" data-id="sobre-mi">${PHOTO('sm')}<div style="text-align:left"><div class="who">${t('by')}</div><div class="what">${longD(a.d)}. ${t('min').replace('{n}',a.min)}</div></div></a></header>
  ${a.layout==='album'?`<div class="album-hero" aria-hidden="true"><div class="vinyl" id="vinyl"><div class="vl"><b>Sincerely</b><span>2025</span></div></div><div class="sleeve"><span>Kali Uchis</span><b>Sincerely</b><span>${lang==='es'?'Crítica de R. Grisales':'Review by R. Grisales'}</span></div></div>`:''}
  ${a.hero?`<figure class="art-hero reveal"><img src="${a.hero[0]}" alt="${L(a.hero[1])}"><figcaption>${L(a.hero[1])}</figcaption></figure>`:''}
  ${lang==='en'?`<p class="only-es">${t('onlyEs')}</p>`:''}
  ${a.layout==='album'?`<div class="album-grid"><aside class="ficha"><div class="ficha-in"><div class="kicker">${lang==='es'?'Ficha técnica':'Fact sheet'}</div>${a.ficha.map(([k,v])=>`<div class="fi"><span>${k}</span>${v}</div>`).join('')}<div class="kicker" style="margin-top:22px">${lang==='es'?'Trayectoria':'Discography'}</div><div class="disco">${a.disco.map(([y,n])=>`<div class="${n==='Sincerely'?'on':''}"><span>${y}</span>${n}</div>`).join('')}</div></div></aside><div class="body">${body}<div class="fin" aria-hidden="true"></div></div></div>`:`<div class="body${a.layout==='expo'?' expo':''}">${body}<div class="fin" aria-hidden="true"></div></div>`}
  <div class="cite"><div class="lbl"><span>${t('citeL')}</span><button type="button" id="citeBtn">${t('copy')}</button></div><p id="citeTxt">Grisales Ramírez, R. (${a.d.slice(0,4)}, ${longD(a.d).replace(/ de \d{4}$/,'').replace(/, \d{4}$/,'')}). <i>${L(a.title)}</i>. Ricardo Grisales Ramírez. https://oranrick.com/${a.slug}</p></div>
  <a class="next" href="#${a.next}" data-id="${a.next}"><span class="mono" style="font-size:12px;color:var(--muted)">${t('nextL')}</span><b><span class="ink" data-vt="${a.next}">${L(nx.title)}</span></b></a>
  ${footer()}
 </article>`;
}

function corpus(){
 if(CORP)return CORP;
 const docs=Object.entries(ART).map(([id,a])=>({id,text:a.body.filter(b=>['p','v'].includes(b[0])).map(b=>b[1]).join(' ')}));
 const cnt={},where={};
 docs.forEach(d=>{(d.text.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/g)||[]).forEach(w=>{const k=w.toLowerCase();if(k.length<4||STOP.has(k))return;cnt[k]=(cnt[k]||0)+1;(where[k]=where[k]||new Set()).add(d.id)})});
 Object.keys(cnt).forEach(k=>{if(k.endsWith('s')&&cnt[k.slice(0,-1)]){const b=k.slice(0,-1);cnt[b]+=cnt[k];where[k].forEach(x=>where[b].add(x));delete cnt[k]}});
 const top=Object.entries(cnt).filter(([k,c])=>c>=3).sort((a,b)=>b[1]-a[1]).slice(0,48).map(([k,c])=>({w:k,c,docs:[...where[k]]}));
 const words=Object.values(docs).reduce((n,d)=>n+(d.text.match(/\S+/g)||[]).length,0);
 CORP={docs,top,words};return CORP;
}
function kwic(w,max=8){
 const re=new RegExp(`(^|[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ])(${w}s?)(?=[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]|$)`,'gi');const out=[];
 corpus().docs.forEach(d=>{let m;re.lastIndex=0;while((m=re.exec(d.text))&&out.length<max){const st=m.index+m[1].length,en=st+m[2].length;out.push({id:d.id,l:d.text.slice(Math.max(0,st-70),st),k:d.text.slice(st,en),r:d.text.slice(en,en+70)})}});
 return out;
}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}
function wire(){
 document.querySelectorAll('a[data-id]:not(.w)').forEach(a=>{a.classList.add('w');a.addEventListener('click',e=>{e.preventDefault();const id=a.dataset.id;if(a.dataset.word)pendingWord=a.dataset.word;if(ART[id]||PAGES[id])go('#'+id,id);else toast(t('soon'))})});
 const cp=async(txt,ok)=>{try{await navigator.clipboard.writeText(txt);toast(ok)}catch(e){toast(t('copyFail'))}};
 const cm=document.getElementById('copyMail');if(cm)cm.onclick=()=>cp('oranrick@gmail.com',t('copied'));
 const cb=document.getElementById('citeBtn');if(cb)cb.onclick=()=>cp(document.getElementById('citeTxt').textContent,t('citeOk'));
 document.querySelectorAll('.ix:not(.w)').forEach(b=>{b.classList.add('w');b.onclick=()=>openWord(b.dataset.w)});
 const pc=document.getElementById('pcard');if(pc&&!pc._w){pc._w=1;pc.onclick=()=>pc.classList.toggle('flip')}
 const nfh=document.getElementById('nfHome');if(nfh)nfh.onclick=e=>{e.preventDefault();go('#')};
 const lt=document.getElementById('letter');if(lt&&!lt._w){lt._w=1;lt._t0=Date.now();lt._human=false;
  ['keydown','pointerdown','paste','touchstart'].forEach(ev=>lt.addEventListener(ev,e=>{if(e.isTrusted)lt._human=true},{passive:true}));
  lt.onsubmit=e=>{e.preventDefault();const es=lang==='es';const b=lt.querySelector('#ltBody'),n=lt.querySelector('#ltName'),m=lt.querySelector('#ltMail'),hp=lt.querySelector('#ltHp');let ok=true;
  const exito=()=>{lt.classList.add('sent');setTimeout(()=>{document.getElementById('ltDone').textContent=es?`Carta recibida, ${n.value.trim()}. Te respondo a ${m.value.trim()}.`:`Letter received, ${n.value.trim()}. I will reply to ${m.value.trim()}.`},1500)};
  const robot=hp.value!==''||!lt._human||Date.now()-lt._t0<3000||/https?:|www\./i.test(n.value);
  if(robot){const btn=lt.querySelector('.lt-send');btn.disabled=true;exito();return}
  const set=(id,msg)=>{document.getElementById(id).textContent=msg;if(msg)ok=false};
  const txt=b.value.trim();set('errBody',txt.length<10||sinSentido(txt)?(es?'Escribe al menos una frase que se entienda.':'Write at least one sentence that makes sense.'):(txt.match(/https?:\/\/|www\./gi)||[]).length>1?(es?'Incluye como mucho un enlace.':'Include one link at most.'):'');
  set('errName',!n.value.trim()?(es?'Firma la carta.':'Sign the letter.'):'');
  set('errMail',!/^\S+@\S+\.\S+$/.test(m.value.trim())?(es?'Necesito un correo válido para responderte.':'I need a valid email to reply.'):'');
  if(!ok)return;let envs=[];try{envs=JSON.parse(localStorage.getItem('rgr-cartas')||'[]').filter(x=>Date.now()-x<36e5)}catch(e){}
  if(envs.length>=3){document.getElementById('ltDone').textContent=es?'Ya me enviaste varias cartas. Dame un rato para leerlas y vuelve a intentarlo en una hora.':'You have already sent me several letters. Give me time to read them and try again in an hour.';return}
  const btn=lt.querySelector('.lt-send');btn.disabled=true;btn.textContent=es?'Enviando…':'Sending…';
  fetch('https://formsubmit.co/ajax/oranrick@gmail.com',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({name:n.value.trim(),email:m.value.trim(),message:txt,_subject:'Carta desde oranrick.com',_template:'table',_honey:hp.value,_blacklist:'casino,crypto,bitcoin,viagra,cialis,backlinks,seo services,porn,loan,forex,escort'})})
  .then(r=>{if(!r.ok)throw new Error(r.status);try{envs.push(Date.now());localStorage.setItem('rgr-cartas',JSON.stringify(envs))}catch(e){}exito()})
  .catch(()=>{btn.disabled=false;btn.textContent=es?'Echar al buzón':'Post it';document.getElementById('ltDone').textContent=es?'No se pudo enviar. Escríbeme directamente a oranrick@gmail.com.':'It could not be sent. Write to me directly at oranrick@gmail.com.'})};
  lt.querySelectorAll('textarea,input').forEach(f=>f.addEventListener('input',()=>{const map={ltBody:'errBody',ltName:'errName',ltMail:'errMail'};document.getElementById(map[f.id]).textContent=''}))}
 if(document.getElementById('conc')&&pendingWord){const w=pendingWord;pendingWord=null;setTimeout(()=>{openWord(w);document.getElementById('indice-palabras').scrollIntoView({behavior:'smooth'})},450)}
 const cv=document.getElementById('cvBtn');if(cv)cv.onclick=()=>toast(t('cvSoon'));
 const rp=document.getElementById('replayBtn');if(rp)rp.onclick=()=>{played=false;if(location.hash.length>1){go('#')}else{render();scrollTo({top:0,behavior:'smooth'})}};
 document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{e.preventDefault();const tgt=a.dataset.goto;const doScroll=()=>{const el=document.getElementById(tgt);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};if(location.hash.length>1&&tgt!=='cartas'){go('#');setTimeout(doScroll,700)}else doScroll()});
 const peek=document.getElementById('peek'),pimg=peek.querySelector('img');
 view.querySelectorAll('.row').forEach(r=>{r.addEventListener('mouseenter',()=>{if(r.dataset.img){pimg.src=r.dataset.img;peek.classList.add('on')}});r.addEventListener('mouseleave',()=>peek.classList.remove('on'));r.addEventListener('mousemove',e=>{peek.style.left=Math.min(e.clientX+260,innerWidth-130)+'px';peek.style.top=e.clientY+'px'})});
}
let skip=false;window.addEventListener('hashchange',()=>{if(skip){skip=false;return}render();window.scrollTo({top:0,behavior:'instant'})});
document.getElementById('brand').addEventListener('click',e=>{e.preventDefault();if(location.hash.length>1)go('#');else window.scrollTo({top:0,behavior:'smooth'})});

const SUN='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>';
const MOONI=document.querySelector('.tico').innerHTML;
function setIcons(){const n=document.documentElement.dataset.theme==='night';document.querySelectorAll('.tico').forEach(x=>x.innerHTML=n?SUN:MOONI)}
const mbm=document.getElementById('mbMenu');mbm.addEventListener('click',()=>{const o=!mb.classList.contains('open');mb.classList.toggle('open',o);mbm.setAttribute('aria-expanded',o)});
document.querySelectorAll('.mb-nav a').forEach(a=>a.addEventListener('click',()=>{mb.classList.remove('open');mbm.setAttribute('aria-expanded','false')}));
document.getElementById('mbTheme').addEventListener('click',()=>document.getElementById('themeToggle').click());
document.getElementById('mbBrand').addEventListener('click',e=>{e.preventDefault();if(location.hash.length>1)go('#');else scrollTo({top:0,behavior:'smooth'})});
/* barra fija al bajar */
const mb=document.getElementById('minibar');
addEventListener('scroll',()=>{const on=document.querySelector('.ticker').getBoundingClientRect().bottom<0;if(on!==mb.classList.contains('on')){mb.classList.toggle('on',on);if(!on)mb.classList.remove('open');mb.setAttribute('aria-hidden',!on);mb.querySelectorAll('a,button').forEach(x=>x.tabIndex=on?0:-1)}},{passive:true});
/* edición día / noche: la página se reimprime */
document.getElementById('themeToggle').addEventListener('click',e=>{
 const btn=e.currentTarget,r=btn.getBoundingClientRect(),h=document.documentElement;
 h.style.setProperty('--x',r.left+r.width/2+'px');h.style.setProperty('--y',r.top+r.height/2+'px');
 const flip=()=>{h.dataset.theme=h.dataset.theme==='night'?'day':'night';btn.setAttribute('aria-pressed',h.dataset.theme==='night');setI18n();wire();setIcons()};
 if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches)return flip();
 h.classList.add('reprint');document.startViewTransition(flip).finished.finally(()=>h.classList.remove('reprint'));
});
document.getElementById('langToggle').addEventListener('click',()=>{lang=lang==='es'?'en':'es';render()});

/* vinilo que gira al leer */
addEventListener('scroll',()=>{const v=document.getElementById('vinyl');if(v)v.style.transform=`translateX(${Math.min(innerWidth<640?40:110,scrollY*.25)}px) rotate(${scrollY*.4}deg)`},{passive:true});
/* progreso de lectura */
addEventListener('scroll',()=>{const p=document.getElementById('progress');if(!document.querySelector('.art')){p.style.width=0;return}const h=document.documentElement;p.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* cabecera: entra como una rotativa */
const brand=document.getElementById('brand');brand.innerHTML=brand.textContent.split(' ').map(w=>`<span class="l">${w}</span>`).join(' ');
render();
requestAnimationFrame(()=>{document.querySelectorAll('.brand .l').forEach((l,i)=>l.style.transitionDelay=(.25+i*.12)+'s');setTimeout(()=>document.body.classList.remove('boot'),60)});
</script>
</body>
</html>
